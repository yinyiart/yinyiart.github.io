<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>殷漪 · 音乐家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #dae7eb;
            font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
            color: #53585f;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 5%;                    /* 左右缩进，使图片与文字对齐 */
        }

        /* 顶部导航 */
        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            margin-bottom: 40px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #53585f;
        }
        .top-nav a {
            color: #53585f;
            text-decoration: none;
        }
        .top-nav a:hover,
        .top-nav a.active {
            color: #1f2c35;
        }

        /* 创作介绍文字 - 分段 */
        .intro {
            margin-bottom: 50px;
            color: #53585f;
            font-size: 1rem;
        }
        .intro p {
            margin-bottom: 1em;                /* 段落间距 */
        }
        .intro p:last-child {
            margin-bottom: 0;
        }

        /* 作品卡片 */
        .work-item {
            margin-bottom: 50px;
        }

        /* 图片区域 */
        .work-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #c0d0e0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #53585f;
            font-size: 0.9rem;
            overflow: hidden;
        }
        .work-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .work-header {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 8px;
        }

        .work-title {
            font-size: 1.3rem;
            font-weight: 400;
            color: #53585f;
            letter-spacing: 0.5px;
        }

        .work-year {
            font-size: 0.85rem;
            color: #53585f;
        }

        .player-box {
            background: transparent;
            padding: 0;
            border: none;
            margin-top: 5px;
        }

        .work-description {
            font-size: 0.9rem;                 /* 调小 */
            margin-bottom: 16px;
            color: #53585f;
            padding-left: 0;
            border-left: none;
        }

        /* 自定义播放器 - 按钮透明 */
        .custom-player {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
        }

        .play-btn {
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            background: transparent;             /* 背景透明 */
            border: none;
            border-radius: 0;
            color: #53585f;                      /* 三角形与文字同色 */
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: none;
        }
        .play-btn:hover {
            background: transparent;              /* 悬停无变化 */
            color: #53585f;
        }

        .time {
            font-size: 0.85rem;
            color: #53585f;
            min-width: 80px;
            font-variant-numeric: tabular-nums;
        }

        .seek-slider {
            flex: 1;
            height: 4px;
            background: #b0c8e0;
            border-radius: 0;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
            min-width: 100px;
        }
        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 0;
            height: 0;
            opacity: 0;
        }
        .seek-slider::-moz-range-thumb {
            width: 0;
            height: 0;
            opacity: 0;
            border: none;
        }
        .seek-slider::-moz-range-track {
            height: 4px;
            background: #b0c8e0;
            border-radius: 0;
        }
        .seek-slider::-webkit-slider-runnable-track {
            height: 4px;
            background: linear-gradient(to right, #3f5a6b, #3f5a6b) 0% / var(--progress) 100% no-repeat #b0c8e0;
        }
        .seek-slider::-moz-range-progress {
            height: 4px;
            background-color: #3f5a6b;
        }

        .audio-extra {
            font-size: 0.8rem;
            color: #53585f;
            margin-top: 8px;
            text-align: right;
        }
        .audio-extra a {
            color: #53585f;
            text-decoration: none;
            border-bottom: 1px dotted;
        }

        .footer-nav {
            margin-top: 60px;
            text-align: center;
            font-size: 0.8rem;
            color: #53585f;
        }
        .footer-nav a {
            color: #53585f;
            text-decoration: none;
            margin: 0 12px;
            border-bottom: 1px solid transparent;
        }
        .footer-nav a:hover {
            border-bottom-color: #53585f;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            body {
                padding: 20px 10px;              /* 左右内边距缩小，但container会处理缩进 */
            }
            .container {
                padding: 0 8%;                    /* 手机上更内缩 */
            }
            .top-nav {
                justify-content: center;
                gap: 20px;
                flex-wrap: wrap;
            }
            .intro { margin-bottom: 30px; }
            .work-item { margin-bottom: 40px; }
            .work-header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .work-title { font-size: 1.2rem; }
            .work-year { font-size: 0.8rem; }
            .custom-player { flex-wrap: wrap; gap: 6px; }
            .play-btn { width: 28px; height: 28px; }
            .time { min-width: 70px; font-size: 0.75rem; }
            .seek-slider { min-width: 120px; order: 4; width: 100%; }
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .container { max-width: 100%; }
        }

        @media (min-width: 1400px) {
            .container { max-width: 1100px; }
            .work-title { font-size: 1.5rem; }
        }

        @media (hover: none) {
            .play-btn:hover {
                background: transparent;
                color: #53585f;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 音乐创作介绍（分段） -->
        <div class="intro">
            <p>殷漪的音乐生涯开始于慢核乐队，兼任贝司手与主唱。</p>
            <p>2000年转向数字音乐创作与笔记本现场表演。2005以音乐家的角色成为前卫表演团体“组合嬲”的创始成员。</p>
            <p>殷漪早期的音乐创作领域包括:现场音乐表演、现代舞、肢体剧场。委约其音乐作品的表演团体包括“组合嬲”(上海)、Rubato 舞团(柏林)、广东现代舞蹈团、谢欣舞蹈剧场、二高表演。</p>
            <p>近年来其音乐创作主要集中于基于实地录音和原声乐器的混合音乐。</p>
        </div>

        <!-- 作品列表（全部保留，此处仅展示第一首，完整版包含所有10首，代码中已包含） -->

    <script>
        // 自定义播放器逻辑（与之前相同）
        document.querySelectorAll('.custom-player').forEach(player => {
            const audio = player.querySelector('audio');
            const playBtn = player.querySelector('.play-btn');
            const timeSpan = player.querySelector('.time');
            const seekSlider = player.querySelector('.seek-slider');

            audio.addEventListener('loadedmetadata', () => {
                seekSlider.max = audio.duration;
                timeSpan.textContent = `0:00 / ${formatTime(audio.duration)}`;
            });

            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                    playBtn.textContent = '❚❚';
                } else {
                    audio.pause();
                    playBtn.textContent = '▶';
                }
            });

            audio.addEventListener('timeupdate', () => {
                seekSlider.value = audio.currentTime;
                timeSpan.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
                const progress = (audio.currentTime / audio.duration) * 100 || 0;
                seekSlider.style.setProperty('--progress', progress + '%');
            });

            seekSlider.addEventListener('input', () => {
                audio.currentTime = seekSlider.value;
            });

            audio.addEventListener('ended', () => {
                playBtn.textContent = '▶';
                seekSlider.value = 0;
                timeSpan.textContent = `0:00 / ${formatTime(audio.duration)}`;
                seekSlider.style.setProperty('--progress', '0%');
            });

            function formatTime(seconds) {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
        });
    </script>
