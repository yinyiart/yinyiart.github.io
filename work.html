<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>殷漪 · 作品详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #59585f;
            font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
            color: #f0f4f8;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5%;
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            margin-bottom: 40px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d0d8e0;
        }
        .top-nav a {
            color: #d0d8e0;
            text-decoration: none;
        }
        .top-nav a:hover {
            color: #ffffff;
        }

        /* 左右布局容器 */
        .work-detail {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
        }

        /* 左侧文字区域（固定） */
        .work-info {
            flex: 1 1 40%;
            position: sticky;
            top: 40px;
            align-self: flex-start;
            max-height: calc(100vh - 120px);
            overflow-y: auto;  /* 如果文字过多可滚动 */
            padding-right: 10px;
        }

        .work-title {
            font-size: 2rem;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .work-year {
            font-size: 1rem;
            color: #d0d8e0;
            margin-bottom: 20px;
        }
        .work-description {
            font-size: 1rem;
            color: #f0f4f8;
            white-space: pre-line;  /* 保留换行 */
        }

        /* 右侧图片列表（横向滑动） */
        .work-images {
            flex: 1 1 60%;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 10px;  /* 留出滚动条空间 */
        }
        .image-list {
            display: inline-flex;
            gap: 15px;
        }
        .image-item {
            flex: 0 0 auto;
            width: 500px;           /* 可调整图片显示宽度 */
            height: auto;
        }
        .image-item img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
            background-color: #7a8088;  /* 占位色 */
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #d0d8e0;
            text-decoration: none;
            border-bottom: 1px dotted;
        }
        .back-link:hover {
            color: #ffffff;
        }

        /* 响应式：小屏幕时改为上下布局 */
        @media (max-width: 800px) {
            .work-detail {
                flex-direction: column;
            }
            .work-info {
                position: static;
                max-height: none;
                overflow-y: visible;
            }
            .work-images {
                overflow-x: auto;
            }
            .image-item {
                width: 80vw;  /* 移动端图片宽度为视窗80% */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <a href="index.html">殷漪</a>
            <a href="musician.html">音乐家</a>
            <a href="artist.html">艺术家</a>
            <a href="curator.html">策展人</a>
            <a href="writing.html">写作</a>
            <a href="about.html">关于</a>
        </div>

        <div id="work-content">
            <!-- 动态内容将插入此处 -->
            <p style="color:#d0d8e0;">加载中...</p>
        </div>

        <a href="artist.html" class="back-link">← 返回艺术家列表</a>
    </div>

    <script>
        // 作品数据（需补充 images 数组）
        const works = [
            { id: 'gan', title: '感官的流动', year: '2025', description: '作品描述待补充...', images: ['images/gan-1.jpg', 'images/gan-2.jpg'] },
            { id: 'ligeti', title: '里盖蒂的100节拍器', year: '2025', description: '作品描述待补充...', images: ['images/ligeti-1.jpg'] },
            { id: 'zhengduo', title: '争夺', year: '2025', description: '作品描述待补充...', images: [] },
            { id: 'wo', title: '我听到了', year: '2023', description: '作品描述待补充...', images: [] },
            { id: 'guishi', title: '归时始无声', year: '2023', description: '作品描述待补充...', images: [] },
            { id: 'bumian', title: '不眠电台', year: '2023', description: '作品描述待补充...', images: [] },
            { id: 'women', title: '我们中的他们，他们中的我们', year: '2022', description: '作品描述待补充...', images: [] },
            { id: 'cong', title: '从_____到新天地', year: '2022', description: '作品描述待补充...', images: [] },
            { id: 'linju', title: '邻居', year: '2022', description: '作品描述待补充...', images: [] },
            { id: 'yinyue', title: '音乐对我们来说到底意味着什么？', year: '2022', description: '作品描述待补充...', images: [] },
            { id: 'shanghai', title: '上海', year: '2021', description: '作品描述待补充...', images: [] },
            { id: 'nide', title: '你的声音里', year: '2021', description: '作品描述待补充...', images: [] },
            { id: 'ruch', title: '如初', year: '2021', description: '作品描述待补充...', images: [] },
            { id: 'shesheng', title: '摄生', year: '2020', description: '作品描述待补充...', images: [] },
            { id: 'zhenshen', title: '真身', year: '2019', description: '作品描述待补充...', images: [] },
            { id: 'xiangxi', title: '向西', year: '2019', description: '作品描述待补充...', images: [] },
            { id: 'liuge', title: '聆听的六个姿态', year: '2019', description: '作品描述待补充...', images: [] },
            { id: 'shige', title: '十个墙角', year: '2018', description: '作品描述待补充...', images: [] },
            { id: 'meishuguan', title: '美术馆', year: '2018', description: '作品描述待补充...', images: [] },
            { id: 'erzhai', title: '耳宅声景', year: '2018', description: '作品描述待补充...', images: [] },
            { id: 'ditu', title: '地图', year: '2018', description: '作品描述待补充...', images: [] },
            { id: 'yici', title: '一次上海的旅程', year: '2017', description: '作品描述待补充...', images: [] },
            { id: 'hailang', title: '海浪', year: '2016', description: '作品描述待补充...', images: [] },
            { id: 'tingdao', title: '你听到过海', year: '2016', description: '作品描述待补充...', images: [] },
            { id: 'liwu', title: '礼物', year: '2016-2021', description: '作品描述待补充...', images: [] },
            { id: 'xinjing', title: '心经', year: '2014', description: '作品描述待补充...', images: [] },
            { id: 'dinghai', title: '20140901-20140930', year: '2014', description: '作品描述待补充...', images: [] },
            { id: 'weiliao', title: '为了告别的聚会', year: '2013-2019', description: '作品描述待补充...', images: [] },
            { id: 'moshnegren', title: '陌生人', year: '2013', description: '作品描述待补充...', images: [] },
            { id: 'heliu', title: '你可以无数次聆听同一条河流', year: '2012-2016', description: '作品描述待补充...', images: [] },
            { id: 'wuti', title: '无题（乐谱一）', year: '2011', description: '作品描述待补充...', images: [] },
            { id: 'sanfenzhong', title: '三分钟', year: '2008|2020', description: '作品描述待补充...', images: [] }
        ];

        // 获取URL参数中的id
        const urlParams = new URLSearchParams(window.location.search);
        const workId = urlParams.get('id');
        const work = works.find(w => w.id === workId);

        const container = document.getElementById('work-content');

        if (!work) {
            container.innerHTML = '<p style="color:#d0d8e0;">作品不存在或ID错误。</p>';
        } else {
            // 生成图片列表HTML
            let imagesHtml = '';
            if (work.images && work.images.length > 0) {
                const imageItems = work.images.map(img => `
                    <div class="image-item">
                        <img src="${img}" alt="${work.title}">
                    </div>
                `).join('');
                imagesHtml = `
                    <div class="work-images">
                        <div class="image-list">
                            ${imageItems}
                        </div>
                    </div>
                `;
            } else {
                // 无图片时显示占位
                imagesHtml = `
                    <div class="work-images">
                        <div class="image-list">
                            <div class="image-item" style="width:300px; background:#7a8088; display:flex; align-items:center; justify-content:center; color:#d0d8e0;">暂无图片</div>
                        </div>
                    </div>
                `;
            }

            const html = `
                <div class="work-detail">
                    <div class="work-info">
                        <div class="work-title">${work.title}</div>
                        <div class="work-year">${work.year}</div>
                        <div class="work-description">${work.description.replace(/\n/g, '<br>')}</div>
                    </div>
                    ${imagesHtml}
                </div>
            `;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
