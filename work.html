        const works = [
            { id: 'gan', title: '感官的流动', year: '2025', description: `感官的流动

15频影像 4通道声音。

在“感官的流动”中，我选择了一个特殊的城市位置——苏州河河道，作为观看上海的视角和聆听上海的听位。

多屏的影像和多声道声音设置，重新编织了不同时态中对于同一个视角的凝视，与此同时来自城市的声音不息流变，则显露城市自身运作的动力。我想通过静止与流动的配置，唤起观众对于城市感受的意识，并在两种感官之间流动。在影像与声音两种媒介非协调运作的过程中，探讨观看与聆听的特征与差异。`, images: [] },
            { id: 'ligeti', title: '利盖蒂的100节拍器', year: '2025', description: `里盖蒂的100个节拍器

100个机械节拍器，10位表演者，1位指挥。上海当代艺术博物嘉伯丽儿·香奈儿空间揭幕仪式委托，改编利盖蒂作品《节拍器交响诗》。
整个表演将由10位表演者推动载有100个节拍器的手推车在表演现场按事先编排好的移动路线，停止点位，身体姿态，空间布局，节拍器与观众距离关系等等一系列条件实施完成。指挥沿袭古典音乐先锋派和激浪派的传统，混合使用图形谱和文字谱来现场指挥。

显而易见，创作于1962年的《节拍器交响诗》受到当时激浪派的影响。在读到利盖蒂在自述中说到这个作品中文字谱的使用是对于音乐手段的批判时，我在想，音乐或者其他的艺术是如何影响当代艺术的。

在我的构想中，在PSA进行的《节拍器交响诗》不是在技术上去复现当年利盖蒂的音乐声响和音乐批判，因为催生这两者的时代语境已经发生了深刻的变化。而是如何在这个作品的演绎中去激活在场所有人的听觉意识，在这种听觉意识中建立临时的文化共同体。这里所说的听觉意识不是抽象的概念，也不是声音理论中的具体的“主动聆听”，而是“听觉·声音”如何去与仪式、表演、身体、空间、时间相连接，或者进一步说，如何在仪式、表演、身体、空间、时间中去揭蔽由声音而激发的听觉。

这次仪式|表演将是流动的，身体的，即生即灭的。`, images: ['images/ligeti01.jpg', 'images/ligeti02.jpg','images/ligeti03.jpg','images/ligeti04.jpg','images/ligeti05.jpg','images/ligeti06.jpg','images/ligeti07.jpg','images/ligeti08.jpg','images/ligeti09.jpg','images/ligeti10.jpg','images/ligeti11.jpg','images/ligeti12.jpg'] },
            { id: 'wo', title: '我听到了', year: '2023', description: `文本，气球，食物。
            
            “我听到了”是一件听觉剧场作品。它是由艺术家在“燃冉”艺术驻留期间实施的同名听觉工作坊“我听到了”发展而来。工作坊以听觉练习手册的形式交付于成员，通过一系列的文字指令完成听觉的练习与思考。

该作品需要依据每次作品实施所在地的物理场景重新创作。艺术家围绕听觉的感知意识，历史中的声音观念，作品发生地的物理与人文环境，重新书写文本；邀请观众在阅读文本的过程中执行聆听练习，思考声音观念，游历空间现场。在具体的环境中切身听觉的各个姿态，以此遭遇艺术家提出的“在聆听中生成的多义整体性”。

在这个剧场作品中，观众通过与艺术家进行交换，得到一份指令性文本、一个轻质的标签与一份食物。指令性文本指导观众自主实施听觉作品。相较于通常的表演，表演者和观演者的边界消失。轻质的标签使得在整个场所中可辨识的观众形成不断变化的聆听共同体。食物是从艺术时空回到日常生活的感官通道。

 “我听到了”在语言中是一个陈述性结果，在作品中是一种状态，一个动作，一个姿态，在观众的行动中是聆听的起点。作品既是发生在公共空间中听觉剧场，也是发生在观众意识与身体内部的移动讲座。`, images: [] },
            { id: 'guishi', title: '归时始无声', year: '2023', description: `在消声室静坐后，约翰·凯奇在没有外部声源的情况下听到了自己身体内部的声音。据此他说出了著名的论断：没有无声这回事——There is no such thing as Silence。消声室就是实验室，凯奇试图剥离所有的外部条件去寻找纯粹的无声，但他发现无法剥离他自己。一个人，自身就是一个发声体。在凯奇的经验中“人”是无法剔除的条件，但在他的断言中却无视这个条件。

人是唯一的条件，进一步说身体是唯一条件。听是在身体中发生的，在聆听的行动中，人在闻声，同时也在发声，发声者和闻声者同在一身体中。凯奇的断言割裂了它们，否认了这种同一，也否定了铭刻在听之中身体性。

无声不是一个事物（thing），无声是一种情境（situation），是由人而生的情境。

“归时始无声”，终极的无声是肉身消失的时刻，是死亡的时刻。

作品中的文字“归时始无声”由黑色不锈钢制成，默认状态下在黑色的背景中无法被辨识，只有当隐藏在不锈钢字体中的LED灯通电时才被显现。通电时LED供电电路所产生的电磁场被电磁拾音器拾取为电信号，转化成可闻的声音。作品不断地在通电与断电两种状态间切换，间隔一分钟循环。黑暗中，文字不断显现与消失，空间中同步有声与无声。作品处于“生机”与“死亡”的循环状态中。`, images: [] },
            { id: 'bumian', title: '不眠电台', year: '2023', description: `在作品《不眠电台》中，艺术家在展示空间中设置了多个FM无线电台，每个电台使用一个单独的FM频段发射无线电信号。空间中另设有多个无线电收音机接受各个电台的声音内容。这些声音内容包括艺术家对上海第一批电台播音员的采访，无线台技术以及上海商业电台的历史讲述，上海开埠后早期京剧与爵士乐音频资料，上海地区市民习惯收听的地方戏曲。通过对上海早期无线电广播历史与资料研究与整理，作为上海出生的艺术家在声音中注入个人的对于上海这座城市的情感、理解与想象。在作品现场营造了一个多维时空的声音之境。除此之外，艺术家带着对于历史的思考，在作品有声部分中，加入大量的无线电频段噪声，也在隐喻那些未被记录下的声音被隐没在历史的声音中，化作无法辨认的听觉信号。`, images: [] },
            { id: 'women', title: '我们中的他们，他们中的我们', year: '2022', description: `“发声”是一个主体向他人显示自身存在的最初的行为。这是自我我的肉身化，无需借助皮肤之外的技术。

赵汀阳在《先验论证》中指出，在任何一种语言中，任何一个句子都先天地要求存在着至少一个对应的应答句子，对应的句子要么是肯定要么是否定，总之是应答。如果语言不具有这样先验的对话结构，语言就不成立，“说”出去的话必须可以“听”，可以“回答”，否则就只是声音而不是语言。

艺术家认为在日常生活中，当一句具体的“言语”被说出后，它不是在等待一个语言结构意义上的回答，而是立刻进入社会结构，等待社会结构中他者的应答。

“我们中的他们，他们中的我们”是观众参与运作的声音装置。

由50个喇叭和手机通讯界面组成。50个喇叭其中1个大功率，其他49个为同等小功率。观众可以通过手机无线通讯界面向装置输入一句话。该句话会通过大功率喇叭播放出来，播放结束后，49个小功率喇叭会播放各自存有的之前观众的话。所有的喇叭播放完毕后，大功率喇叭播放的那句话会随机替换49个小功率喇叭中的某一句。以此类推。`, images: [] },
            { id: 'cong', title: '从_____到新天地', year: '2022', description: `现代性以不断生产各种类型的空间在城市中表征自身。在这种生产中，城市的变化通常又以消失与新建作为特征。作为改革开放后上海城市土地开发的经典案例，新天地地产开发项目的新建一度蕴含着某些消失。艺术家尝试在声音和听觉中寻找对于现代性与作为其驱动力的资本批判的可能性，以及批判之后的余音。

“没有声音，这件作品的装置部分也可以成立。这好像是说出了一句断言，但这种断言似曾相识，仿佛正确的废话。有了声音，就有了某种可延续的出路，不是去再次印证已知的，而是给了探索以希望。”——殷漪

艺术家将日常居所空间、新天地的公共空间以及来往两地之间的城市空间作为聆听空间。邀请四位合作者，分别是独立音乐人、人类学家、3D声景设计师和游戏声音设计师共同参与创作。五位参与者从自己熟悉的地方（住宅或者工作场所），自选交通工具向新天地出发，在城市中移动的同时，对城市声音进行实地录音。基于这些实地录音，参与者独立创作各自的声音作品。这些声音作品被放置在住宅艺术设计室的混凝土装置中，观众可以使用耳机随意捕捉混凝土装置中的五个声音作品。`, images: [] },
            { id: 'linju', title: '邻居', year: '2022', description: `在对聆听和声音的思考与研究中，艺术家脱离发现对城市的聆听往往会陷入一种惯性的误区，人们常常容易将美妙的声音都归属于客体化的自然。尤其是在最近回顾了自然史、博物学中的实地录音历史后，艺术家发现新技术，特别是录音技术成熟发展之后，人类通过对自然声音的物质化，不断对自然的对象化和社会化，使自然成为某种文化资源与鉴赏对象，其结果就是遗忘了人类本是属于自然的。

Neighbor is designed as an indoor setting for listening, composed of a carpet, a single-seater sofa, a floor lamp, a letter, a tape recorder, and headphones. Viewers can sit on the sofa and read the letter written by the artist while listening to the chirping of hill myna and the instrument performance of community residents recorded by artist in his residential area.`, images: [] },
            { id: 'yinyue', title: '音乐对我们来说到底意味着什么？', year: '2022', description: `“音乐对我们来说到底意味着什么？”是基于实地录音的讲座性表演。艺术家在进行实地录音实践中发现自己了很多音乐。但这些音乐不是以艺术表演的形态出现在社会结构中的，不是一个鉴赏的对象或者文化商品。于是，艺术家提问，在音乐大部分时间扮演娱乐、休闲、情感化的今天，音乐对我们来说到底意味着什么？除了上述的肤浅单一的关系之外，我们和音乐还可以以怎样的方式产生联结？

表演通过文本朗读，声音聆听和食物品尝，邀请观众对这个提问进行思考和切身感受。`, images: [] },
            { id: 'shanghai', title: '上海', year: '2021', description: `在实地录音专辑《上海》（由阿根廷唱片厂牌Earwitness2021年片出版）制作过程中，艺术家不断在思考这样一个问题：如果录制下来的声音不是被当做音乐听的话，那么该如何去听？这里不是指听的对象的概念，也包括听的形式。在展览《彼此》中，艺术家在位于38层高楼的展厅临窗放置了一个跑步机。当观众走上跑步机开始走动时，耳机里先是传来窗外实时的声音，然后随机播放专辑《上海》中的100个声音，每个声音时长一分钟。观众停止走动，声音也随之消失。`, images: [] },
            { id: 'nide', title: '你的声音里', year: '2021', description: `这是一件需要观众“进入”的作品。更确切地说，只有当观众的身体和意识同时进入艺术家所构想与制作的空间，作品才实时地生成。艺术家通过日常生活中最细微生命节律“行走——脚步声”为加入，使用不同的地面建筑材料，在美术馆的非常规展示空间内重新铺设地面。这些材料原样均现存于今天太原城内的不同地方，有久远的晋祠、文庙，也有刚刚新建的地铁。在重构的美术馆物理空间内，再次组建一个新的声音空间，艺术家尝试通过这种改变语境后的日常行为——行走，重新唤起观众的感知能力——听觉的，触觉的，也希望通过感知能再次回到我们的日常生活中。`, images: [] },
            { id: 'ruch', title: '如初', year: '2021', description: `我想为宰荡的儿童做一个东西，做一个本地村民可以日常使用的东西。同时在某种艺术语境到来的时候，它又具有一种艺术作品的特质。

它处于日常生活和艺术思考的交界处，两边都能够触摸到它。于是，据说起源于拜占庭的旋转木马被挪用到这里，宰荡侗族大歌的童声又被挪到至旋转木马周围。它们在此相遇，就如本地与外来的相遇。这种相遇是否会产生新的东西，我还不得而知。

童声以环绕立体声的方式围绕木马，亦如歌队在鼓楼里歌唱时的旋律。旋转木马转动的时候，便是一个梦生成的开始。最初我们都是喜欢做梦的。`, images: [] },
            { id: 'shesheng', title: '摄生', year: '2020', description: `柏拉图在《斐多篇》对于书写的论述已经提出了与人类演化相伴的技术双面性，它既是解药也是毒药。在今天这种困境表现为人类感官功能和理性心智不断外化，不断被技术替代，结局是我们越来越不相信我们自己。面对技术统领的身体之外的制造欲望与满足欲望的循环机制，我们“身神分离”、“形神涣散”。

艺术家受中国传统身体文化启发，重新体悟“神”对于中国人的文化意义和生命意识价值，思考其与“身”的关系。进而寻找路径，调和生命与技术、身体与感知的连接。从中国传统功法与舞蹈中的步伐、动作、手势、仪态、空间和动静特征中艺术家发展出“摄生”整体的表演内容和形式。尝试使用新的言说方式去连接“身”与“神”。`, images: [] },
            { id: 'zhenshen', title: '真身', year: '2019', description: `《真身》是艺术家脱稿的一对表演项目。表演者脱稿将使用如同中国词诗“一人一方”的形式与观演者共同创造表演内容。表演内容围绕声音展开，包括但不限于：历史经典声音作品演绎，个人电脑音乐现场，电子硬件与物件混合表演，实地录音行走，基于实地录音的声音景观营造，内外都听觉空间营造，等等。在演出后，表演者将基于自身主观感受为观演者配置一款以其他名命名的草本茶饮，以建构观演者的味觉形象，通过茶饮传达并展示这一建构。`, images: [] },
            { id: 'xiangxi', title: '向西', year: '2019', description: `《向西》是以苏州河上的四川路桥为场所创作的5频8声道声音影像装置。在作品中一位音乐家在城市的一座桥上表演音乐，这位音乐家在不可同时间的自己合奏。通过向城市中注入音乐，艺术家脱离用音乐把城市中不同时间不同空间的声和影像编制起来，营造出浅吟式的城市场所。邀请观众在展览现场用自己的身体和意识去构建出在时间空间重叠中溢出的四川路桥。`, images: [] },
            { id: 'liuge', title: '聆听的六个姿态', year: '2019', description: `艺术家以“聆听”作为线索，把都市空间作为表演场地，通过艺术家写给观众的六封信，引领观众在具有历史特征的特定城市场所间移动，用听觉去体验和回应声音艺术史上多个语句。包括来自John Cage, Max Neuhaus及Pierre Schaeffer的作品和观念。

如果聆听不只是一种修辞，一种玄思，那一定是因为身体的出场。身体出现在一个位置上，一个空间由此生成。聆听不是只关乎听觉系统。聆听实实在在地发生在身体之中。聆听一旦发生，随即穿过身体的边界。一个姿态是对身体的塑形，也给予聆听一种框架。`, images: [] },
            { id: 'shige', title: '十个墙角', year: '2018', description: `一个空间不是界面的围合。一个事件发生，一个空间生成。`, images: [] },
            { id: 'meishuguan', title: '美术馆', year: '2018', description: `声音拥有一对穿越边界的能力。

声音在穿越边界的同时，也生成其自身的边界。但这边界时刻变化、模糊不清。

“用声音的方式”去使用一座尚未完工的美术馆。拍摄一部由声音驱动的声音艺术影像作品。`, images: [] },
            { id: 'erzhai', title: '耳宅声景', year: '2018', description: `通过实地录音而获得的25个来自城市和乡村的声音被分置在25个60cm乘60cm的方形空间中。观众可在其内自由移动，一边听到每个半封闭空间内的声音，一边因为移动触发各个声音响度发生变化而混合来自城市和乡村的声音。此作品为2018起后要有大地艺术三年展中方文记特别单位委约作品，亦是通过空间和声音回应乡村和城市之议题。`, images: [] },
            { id: 'ditu', title: '地图', year: '2018', description: `身为现代舞者的妻子再次怀孕。艺术家与妻子和未出现的胎儿一起进行了一次即兴表演。影像中胎动的痕迹被口红记录下来。声音来自艺术家在地中海和印度洋海滩上使用水下拾音器录制的声音。水下拾音器在海水涨落见录下水面下和水面上的声音，还有与海滩砂砾的摩擦。这是一种关于“摩擦”的直接感受：海水从沙滩上褪去，一些孩子在沙滩上嬉戏的声音。`, images: [] },
            { id: 'yici', title: '一次上海的旅程', year: '2017', description: `在社会性公共空间内，组织化系统化后的声音不但规则我们的身体，还规则我们的知识和文化。在上海，上海话被排斥在官方管理的上海最大的流动公共空间——轨道交通之外。

在这个公共空间内信息传达不能用上海话。上海话在这里被隐形地贬损和禁止。

在对于城市公共空间中声音机制的观察和思考后，艺术家创作了作为作品《一次上海的旅程》。`, images: [] },
            { id: 'hailang', title: '海浪', year: '2016', description: `曾经有策展人问我，是否有什么东西是不可被见到而只能被听到。我回答：风。

多个落地电扇摆放成的矩形，运行和静止交替进行，时隔5分钟。通过精心地摆放设计，电扇所产生的风只在矩形内部运动、消解。当相对的电扇面对面掠过时，不同运动方向的风碰撞产生的声音混合在一起。在这个作品中，声音和风来自同一个源头——空气的运动。声音的生成和风的消解同时发生。在此，生成即是消解，消解即是生成。`, images: [] },
            { id: 'tingdao', title: '你听到过海', year: '2016', description: `城市空间（开放的，共用的）中声音的运行自有其逻辑和机制。这些逻辑和机制隐秘而又强力。艺术家试图通过观察和聆听去探究这些逻辑，进而想去改变。对原有的逻辑和机制提供想象的可能。因为这是微观政治行动。艺术家以艺术之名与商业机构协商内容为海的声音作品放入商业空间的公共播放系统，作为该空间日常播放的声音。`, images: [] },
            { id: 'liwu', title: '礼物', year: '2016-2021', description: `从2008年开始，德国铁路公司在汉堡中央车站入口广场处播放古典音乐，如维瓦尔第的《四季》。以此来驱赶在该区域停留的流浪人员。官方称这些流浪人员有与毒品相关的犯罪行为。据当地媒体Hamburger Abendblatt 一汉堡晚报报道，这一措施效果显著。

《礼物》在公共空间内建立独有的听觉空间，邀请人们通过无线蓝牙设备，在《四季》和自有的声音间选择，决定公共空间内被听到的声音内容。《礼物》是对汉堡中央火车站声音播放的反向与行动，是对于不同语境下公共空间声音运行逻辑与机制的探索和实验。`, images: [] },
            { id: 'xinjing', title: '心经', year: '2014', description: '作品描述待补充。', images: [] },
            { id: 'dinghai', title: '20140901-20140930', year: '2014', description: `定海桥地区是上海市区仅存的几个大面积旧区，有着丰富的历史，在民间也流传大量灰色铁事，宛如现代上海的一个久远的桥苑。在接收到创作邀请后，艺术家陷于一种矛盾的心理。因为他小时候也是生长类似的旧区中，原来成长的旧区已经消失，再次回到相似的环境中，艺术家却无法做到拥抱过去，也不可能拥有外来者猎奇眼光。就如艺术家提到的，这里的道路大多数情况下是湿的，因为室内没有排水系统；这里的人相互熟悉，所谓的公共生活丰富，但却缺乏私人和公共空间之间的边界意识；空气里弥漫着熟悉的食物味道，但卫生状况堪忧；白天和黑夜是两个不同的世界。`, images: [] },
            { id: 'weiliao', title: '为了告别的聚会', year: '2013-2019', description: `50年前，他们响应毛主席号召上山下乡。50年后，他们回到自己出生的城市，在公园里一起集体歌唱。为什么200个退休老人会在每个周末聚集在公园里集体唱他们时代的歌曲呢？为什么他们选择使用发声的方式呢？为什么他们选择公园呢？这宛如一次为了告别的聚会。

“为了告别的聚会”是一件带有音乐表演的声音装置。照片和8个封闭在密封玻璃罐里的扬声器排放在缓慢转动的自动旋转圆桌上。仿佛是一个聚餐的场景。每个扬声器都在循环播放一首由艺术家实地录音的方式录制的，由鲁迅公园自发组织的唱歌集体演唱的歌曲。在封闭的罐子里，所有的声音模糊而压抑，在自动旋转圆桌的转动下形成一个变化的声音。每隔30分钟，现场会有小号演奏员演奏艺术家创作的音乐，与玻璃罐里的扬声器共同发声。`, images: [] },
            { id: 'moshnegren', title: '陌生人', year: '2013', description: `“2013年，我迎来第一个孩子。在他/她未降生时，我渐渐感觉这是一个陌生人。我将遇到一个陌生人。这种陌生感一定来自于我对他/她的一无所知。同时理智又告诉我他/她将是我最亲近的人，这更加加深了陌生感。我与父亲母亲的相识是渐进的，我与孩子的相识是突如其来的。我有很多疑惑和担忧。”

双频影像中左边是艺术家妻子怀孕的身体，右边是看似电影片尾滚动的演员表。但实际内容是艺术家认为自己的孩子可能拥有的社会身份。`, images: [] },
            { id: 'heliu', title: '你可以无数次聆听同一条河流', year: '2012-2016', description: `声音是与时间黏连在一起的能量变化。与声音黏连在一起的不是抽象化后的脉冲时间。是延绵，是时间流。人类开始获得记录声音流的技术时，也开始记录下时间流。最初所使用的模拟技术和存储声音流的介质都很好的显示了“流”的概念。在蜡筒，钢丝，唱盘，磁带上保存下的能量变化都是连续的。至今为止所有的影像记录技术和声音数字技术则都是离散系统，所保持的是时间切片，你所看到的听到了是时间切片的序列。

聆听磁带播放的声音，听到的是声音流，经验到的是时间流。`, images: [] },
            { id: 'wuti', title: '无题（乐谱一）', year: '2011', description: `艺术家发现自己在聆听音乐现场的某些时刻，音乐的结构和意义是在其自身的听觉中产生的，甚至可以说在听觉以及相连的想象中建构了当时听到的音乐。

艺术家重新组织了计算机音乐生产的部件：母指琴、自制接触式话筒、使用的Pure Data软件界面、引入随机概率的计算程序、喇叭、空间墙面材料（吸音板通常安装在录音室、混音室和音乐厅的墙面上），创建新的听觉想象场域。`, images: [] },
            { id: 'sanfenzhong', title: '三分钟', year: '2008|2020', description: `艺术家于2008年5月19日下午在上海市延安西路凯旋路交叉路上拍摄了全国为汉川地震默哀3分钟的电影。之后邀请了两位女性朋友尽力吸气然后用手捂住嘴发声，并在发声时尽自己最大的可能把气息吐完。这些近于极限的呼气和发声被记录，并作为素材使用在为汉川地震默哀3分钟所做的音乐中。

12年后中国再次响起默哀的防空警报声以悼念在新冠疫情中去世的人们，艺术家于2020年4月4号上午10点在上海市南京东路步行街上再次拍摄3分钟的影像。

在声音中，一个情感共同体被创建出来。`, images: [] }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const workId = urlParams.get('id');
        const work = works.find(w => w.id === workId);

        const container = document.getElementById('work-content');

        if (!work) {
            container.innerHTML = '<p style="color:#d0d8e0;">作品不存在或ID错误。</p>';
        } else {
            let imagesHtml = '';
            if (work.images && work.images.length > 0) {
                const imageItems = work.images.map(img => `
                    <div class="image-item">
                        <img src="${img}" alt="${work.title}">
                    </div>
                `).join('');
                imagesHtml = `
                    <div class="work-images">
                        <div class="image-list">
                            ${imageItems}
                        </div>
                    </div>
                `;
            } else {
                imagesHtml = `
                    <div class="work-images">
                        <div class="image-list">
                            <div class="image-placeholder">暂无图片</div>
                        </div>
                    </div>
                `;
            }

            const html = `
                <div class="work-detail">
                    <div class="work-info">
                        <div class="work-title">${work.title}</div>
                        <div class="work-year">${work.year}</div>
                        <div class="work-description">${work.description.replace(/\n/g, '<br>')}</div>
                    </div>
                    ${imagesHtml}
                </div>
            `;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
