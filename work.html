<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>殷漪 · 作品详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #59585f;
            font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
            color: #f0f4f8;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5%;
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            margin-bottom: 40px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d0d8e0;
        }
        .top-nav a {
            color: #d0d8e0;
            text-decoration: none;
        }
        .top-nav a:hover {
            color: #ffffff;
        }

        .work-detail {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
        }

        .work-info {
            flex: 1 1 40%;
            position: sticky;
            top: 40px;
            align-self: flex-start;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            padding-right: 10px;
        }

        .work-title {
            font-size: 2rem;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .work-year {
            font-size: 1rem;
            color: #d0d8e0;
            margin-bottom: 20px;
        }
        .work-description {
            font-size: 1rem;
            color: #f0f4f8;
            white-space: pre-line;
        }

        .work-images {
            flex: 1 1 60%;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 10px;
        }
        .image-list {
            display: inline-flex;
            gap: 15px;
        }
        .image-item {
            flex: 0 0 auto;
            width: 500px;
            height: auto;
        }
        .image-item img {
            width: 100%;
            height: auto;
            display: block;
            background-color: #7a8088;
        }
        .image-placeholder {
            width: 300px;
            background: #7a8088;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d0d8e0;
            height: 200px;
        }

        @media (max-width: 800px) {
            .work-detail {
                flex-direction: column;
            }
            .work-info {
                position: static;
                max-height: none;
                overflow-y: visible;
            }
            .work-images {
                overflow-x: auto;
            }
            .image-item {
                width: 80vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <a href="index.html">殷漪</a>
            <a href="musician.html">音乐家</a>
            <a href="artist.html">艺术家</a>
            <a href="curator.html">策展人</a>
            <a href="writing.html">写作</a>
            <a href="about.html">关于</a>
        </div>

        <div id="work-content">
            <p style="color:#d0d8e0;">加载中...</p>
        </div>
    </div>

    <script>
        const works = [
            // 您已经整理的作品数据（请确保完整复制之前的内容）
            { id: 'gan', title: '感官的流动', year: '2025', description: '作品描述待补充。', images: [] },
            { id: 'ligeti', title: '里盖蒂的100节拍器', year: '2025', description: '作品描述待补充。', images: [] },
            { id: 'zhengduo', title: '争夺', year: '2025', description: '作品描述待补充。', images: [] },
            { id: 'wo', title: '我听到了', year: '2023', description: `“我听到了”是艺术家脱离最新的听觉剧场作品。它是由艺术家在“燃曲”艺术驻留期间实施的同名听觉工作坊“我听到了”发展而来。工作坊以听觉练习手册的形式交付于成员，通过一系列的文字指令完成听觉的练习与思考。\n\n该作品需要依据每次作品实施所在地的物理场景重新创作。艺术家围绕听觉的感知意识，历史中的声音观念，作品发生地的物理与人文环境，重新书写文本；邀请观众在阅读文本的过程中执行聆听练习，思考声音观念，游历空间现场。在具体的环境中切身听觉的各个姿态，以此遭遇艺术家提出的“在聆听中生成的多义整体性”。`, images: [] },
            // ... 其他作品（请补充完整）
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const workId = urlParams.get('id');
        const work = works.find(w => w.id === workId);

        const container = document.getElementById('work-content');

        if (!work) {
            container.innerHTML = '<p style="color:#d0d8e0;">作品不存在或ID错误。</p>';
        } else {
            let imagesHtml = '';
            if (work.images && work.images.length > 0) {
                const imageItems = work.images.map(img => `
                    <div class="image-item">
                        <img src="${img}" alt="${work.title}">
                    </div>
                `).join('');
                imagesHtml = `
                    <div class="work-images">
                        <div class="image-list">
                            ${imageItems}
                        </div>
                    </div>
                `;
            } else {
                imagesHtml = `
                    <div class="work-images">
                        <div class="image-list">
                            <div class="image-placeholder">暂无图片</div>
                        </div>
                    </div>
                `;
            }

            const html = `
                <div class="work-detail">
                    <div class="work-info">
                        <div class="work-title">${work.title}</div>
                        <div class="work-year">${work.year}</div>
                        <div class="work-description">${work.description.replace(/\n/g, '<br>')}</div>
                    </div>
                    ${imagesHtml}
                </div>
            `;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
