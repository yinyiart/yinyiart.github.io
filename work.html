<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>殷漪 · 作品详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #59585f;
            font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
            color: #f0f4f8;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 5%;
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            margin-bottom: 40px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d0d8e0;
        }
        .top-nav a {
            color: #d0d8e0;
            text-decoration: none;
        }
        .top-nav a:hover {
            color: #ffffff;
        }

        .work-header {
            margin-bottom: 30px;
        }
        .work-title {
            font-size: 2rem;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .work-year {
            font-size: 1rem;
            color: #d0d8e0;
        }

        .work-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #7a8088;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d0d8e0;
            font-size: 1rem;
            overflow: hidden;
        }
        .work-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .work-description {
            font-size: 1rem;
            margin-bottom: 30px;
            color: #f0f4f8;
            white-space: pre-line;  /* 保留换行 */
        }

        .work-media {
            margin-bottom: 40px;
        }
        .work-media h3 {
            font-size: 1.2rem;
            font-weight: 400;
            border-bottom: 1px solid #7a8088;
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .audio-player, .video-player {
            background: #4a4a52;
            padding: 15px;
            margin-bottom: 20px;
        }
        audio, video {
            width: 100%;
            outline: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: #d0d8e0;
            text-decoration: none;
            border-bottom: 1px dotted;
        }
        .back-link:hover {
            color: #ffffff;
        }

        @media (max-width: 600px) {
            .work-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <a href="index.html">殷漪</a>
            <a href="musician.html">音乐家</a>
            <a href="artist.html">艺术家</a>
            <a href="curator.html">策展人</a>
            <a href="writing.html">写作</a>
            <a href="about.html">关于</a>
        </div>

        <div id="work-content">
            <!-- 动态内容将插入此处 -->
            <p style="color:#d0d8e0;">加载中...</p>
        </div>

        <a href="artist.html" class="back-link">← 返回艺术家列表</a>
    </div>

        ];

        // 获取URL参数中的id
        const urlParams = new URLSearchParams(window.location.search);
        const workId = urlParams.get('id');
        const work = works.find(w => w.id === workId);

        const container = document.getElementById('work-content');

        if (!work) {
            container.innerHTML = '<p style="color:#d0d8e0;">作品不存在或ID错误。</p>';
        } else {
            // 构建媒体区块（如果有音频或视频）
            let mediaHtml = '';
            if (work.audio) {
                mediaHtml += `
                    <div class="audio-player">
                        <h3>音频</h3>
                        <audio controls src="${work.audio}"></audio>
                    </div>
                `;
            }
            if (work.video) {
                mediaHtml += `
                    <div class="video-player">
                        <h3>影像</h3>
                        <video controls src="${work.video}"></video>
                    </div>
                `;
            }

            const html = `
                <div class="work-header">
                    <div class="work-title">${work.title}</div>
                    <div class="work-year">${work.year}</div>
                </div>
                <div class="work-image">
                    <img src="${work.image || 'images/placeholder.jpg'}" alt="${work.title}">
                </div>
                <div class="work-description">${work.description}</div>
                ${mediaHtml}
            `;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
