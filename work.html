            { id: 'gan', title: '感官的流动', year: '2025', description: `10频影像，4通道声音

这件作品是受西岸美术馆展览“建造上海：1949年以来的建筑、城市与文化”委托创作。和之前创作的《向西》一样，我把对于上海这座城市的空间关注，聚焦于苏州河。

在主流的城市叙事中，黄浦江是上海最重要的河流。它水体量大，分划浦东浦西，历史上承担了重要的水路交通航运的角色。特别是上海工业原材料运输，绝大部分都依赖黄浦江的畅通。今天在黄浦江两岸我们可以看到大量改造与未改造的工业遗存。
不过作为一个上海市民，我认为与上海人日常生活更加息息相关的是苏州河。查阅一下苏州河上桥的历史和现状就可以感受。
苏州河从生机勃勃到严重污染，再到整治管理，今天呈现出一种平静祥和的样态。但是这种平静祥和却是拒绝于人的。苏州河今天完全成为固定的静态的城市景观。
而我一直想象自己能进入苏州河，沿着河道观看和聆听上海。重塑当年我的母亲摆渡过苏州河的感受。我选择了河道中，这个视角和听角。
在作品拍摄和录音的过程中，我花了两天的时间溯源而上，重游了苏州河。但它像一条压缩了时空和历史的通道。沿岸是变化丰富出人意料的城市局部，由苏州河拼接起来。在作品的呈现形式上，我把这种拼接感也放了进来。

作品由两组共10屏影像和4通道声音组成。每组影像是从一个大场景中的选取的局部，分河道和河岸两部分。屏幕间留有空隙。每组同时播放我录的上海城市声音，这些实地录音不是拍摄的同期声，而是我重游苏州河加上我私人录制的声音档案中选取的城市声音。
多屏的影像和多声道声音设置，重新编织了不同时态中对于同一个视角的凝视，与此同时来自城市的声音不息流变，则显露城市自身运作的动力。我想通过视觉和听觉中的空白与连续，静止与流动的配置，唤起观众对于城市感受的意识，并在两种感官之间流动。在影像与声音两种媒介非协调运作的过程中，探讨观看与聆听的特征与差异。作为一种景观，苏州河已经是城市的某种边界了。而城市声音不断穿越这个边界。

受展览条件所限，现场使用的是显示器，未来希望能使用投影扩展尺度。我想效果会很不一样。`, images: ['images/flux00.jpg','images/flux01.jpg','images/flux02.jpg','images/flux03.jpg','images/flux04.jpg','images/flux05.jpg','images/flux06.jpg','images/flux07.jpg','images/flux08.jpg','images/flux09.jpg','images/flux10.jpg','images/flux11.jpg','images/flux12.jpg','images/flux13.jpg','images/flux14.jpg','images/flux15.jpg'] },
            { id: 'ligeti', title: '利盖蒂的100节拍器', year: '2025', description: `100个机械节拍器，10辆手推餐车，10位表演者，1位指挥

100个机械节拍器，10位表演者，1位指挥。上海当代艺术博物嘉伯丽儿·香奈儿空间揭幕仪式委托，改编利盖蒂作品《节拍器交响诗》。

整个表演将由10位表演者推动载有100个节拍器的手推车在表演现场按事先编排好的移动路线，停止点位，身体姿态，空间布局，节拍器与观众距离关系等等一系列条件实施完成。指挥沿袭古典音乐先锋派和激浪派的传统，混合使用图形谱和文字谱来现场指挥。

显而易见，创作于1962年的《节拍器交响诗》受到当时激浪派的影响。在读到利盖蒂在自述中说到这个作品中文字谱的使用是对于音乐手段的批判时，我在想，音乐或者其他的艺术是如何影响当代艺术的。

在我的构想中，在PSA表演的《节拍器交响诗》不是在技术上去复现当年利盖蒂的音乐声响和音乐批判，因为催生这两者的时代语境已经发生了深刻的变化。而是如何在这个作品的演绎中去激活在场所有人的听觉意识，在这种听觉意识中建立临时的文化共同体。这里所说的听觉意识不是抽象的概念，也不是声音理论中的具体的“主动聆听”，而是“听觉·声音”如何去与仪式、表演、身体、空间、时间相连接，或者进一步说，如何在仪式、表演、身体、空间、时间中去揭蔽由声音而激发的听觉。

这次仪式|表演是流动的，身体的，即生即灭的。

因为不希望干扰表演，我要求现场不拍照记录。所以这里的照片是彩排时候拍的。未来我想这个作品应该是带有表演的装置，在静止和运动之间交替呈现。`, images: ['images/ligeti01.jpg', 'images/ligeti02.jpg','images/ligeti03.jpg','images/ligeti04.jpg','images/ligeti05.jpg','images/ligeti06.jpg','images/ligeti07.jpg','images/ligeti08.jpg','images/ligeti09.jpg','images/ligeti10.jpg','images/ligeti11.jpg','images/ligeti12.jpg'] },
            { id: 'wo', title: '我听到了', year: '2023', description: `文本，气球，食物

“我听到了”是一件听觉剧场作品。它是由我在“燃冉”艺术驻留期间实施的同名听觉工作坊发展而来。工作坊以听觉练习手册的形式交付于成员，通过一系列的文字指令完成听觉的练习与思考。

我会依据每次作品实施所在地的物理场景重新创作，听觉的感知意识，历史中的声音观念，作品发生地的物理与人文环境，重新书写文本；邀请观众在阅读文本的过程中执行聆听练习，思考声音观念，游历空间现场。在具体的环境中切身听觉的各个姿态，以此遭遇我提出的“声音在聆听中生成的多义整体性”。

在这个剧场作品中，观众需要暂时寄存手机，从而得到一份指令性文本、一个轻质的气球与一份食物。指令性文本指导观众自主实施听觉作品。相较于通常的表演，表演者和观演者的边界消失。轻质的气球作为一个可视化的标签使得在整个场所中可辨识的观众形成不断变化的聆听共同体。食物是从艺术时空回到日常生活的感官通道。

“我听到了”在语言中是一个陈述性结果，在作品被实施的过程中是一种状态，一个动作，一个姿态，在观众的行动中是聆听的起点。作品既是发生在公共空间中听觉剧场，也是发生在观众意识与身体内部的移动讲座。`, images: ['images/listening01.jpg','images/listening02.jpg','images/listening03.jpg','images/listening04.jpg','images/listening05.jpg','images/listening06.jpg','images/listening07.jpg'] },
            { id: 'guishi', title: '归时始无声', year: '2023', description: `泥土，裸露式喇叭，音频播放器，功放，电磁麦克风，不锈钢，LED灯，定时器

在消声室静坐后，约翰·凯奇在没有外部声源的情况下听到了自己身体内部的声音。据此他说出了著名的论断：没有无声这回事——There is no such thing as Silence。消声室就是实验室，凯奇试图剥离所有的外部条件去寻找纯粹的无声，但他发现无法剥离他自己。一个人，自身就是一个发声体。在凯奇的经验中“人”是无法剔除的条件，但在他的断言中却无视这个条件。

人是唯一的条件，进一步说身体是唯一条件。听是在身体中发生的，在聆听的行动中，人在闻声，同时也在发声，发声者和闻声者同在一身体中。凯奇的断言割裂了它们，否认了这种同一，也否定了铭刻在听之中身体性。

无声不是一个事物（thing），无声是一种情境（situation），是由人而生的情境。

“归时始无声”，终极的无声是肉身消失的时刻，是死亡的时刻。

作品中的文字“归时始无声”由黑色不锈钢制成，默认状态下在黑色的背景中无法被辨识，只有当隐藏在不锈钢字体中的LED灯通电时才被显现。通电时LED供电电路所产生的电磁场被电磁拾音器拾取为电信号，转化成可闻的声音。作品不断地在通电与断电两种状态间切换，间隔一分钟循环。黑暗中，文字不断显现与消失，空间中同步有声与无声。作品处于“生机”与“死亡”的循环状态中。`, images: ['images/gui01.jpg','images/gui02.jpg'] },
            { id: 'bumian', title: '不眠电台', year: '2003', description: `无线电发射器，音频播放器，收音机，上海非遗钩针织物

无线电既是技术也是记忆。所以在我看来，技术与记忆总是隐秘地交织在一起的。

这件作品是为上海吴昌硕美术馆这座历史保护建筑创作的。建筑原来的主人是近代沪上名流、富商陈桂春的私邸。参观之后我发现建筑的南北方向房间门窗大量使用的是海派黄洋木雕，东西向的门都是西式新古典主义风格。这很恰当地折射出陈桂春的起家经历，从替洋行负责码头业务到自己经营驳船航运。

我在建筑物不同空间内设置了多个FM无线电台，每个电台使用一个单独的FM频段发射无线电信号。空间中另设有多个无线电收音机接受各个电台的声音内容。这些声音内容包括我对上海开埠后第一批电台播音员的采访；无线台技术以及上海商业电台历史的讲述；上海开埠后早期京剧与爵士乐音频资料，上海地区市民习惯收听的地方戏曲。在现场营造了一个多维时空的声音之境。除此之外，作品中还加入大量的无线电频段噪声，也在隐喻那些未被记录下的声音被隐没在历史的声音中，化作无法辨认的听觉信号。

作为上海出生的艺术家，我在无线电声音中注入个人对于上海这座城市的情感、理解与想象。`, images: ['images/bu01.jpg','images/bu02.jpg','images/bu03.jpg'] },
            { id: 'women', title: '我们中的他们，他们中的我们', year: '2022', description: `裸露式喇叭，微型电机，钢丝绳，交换机，定制软件，电脑，ipad

“发声”是一个主体向他人显示自身存在的最初的行为。这是自我的肉身化，无需借助皮肤之外的技术。

赵汀阳在《先验论证》中指出，在任何一种语言中，任何一个句子都先天地要求存在着至少一个对应的应答句子，对应的句子要么是肯定要么是否定，总之是应答。如果语言不具有这样先验的对话结构，语言就不成立，“说”出去的话必须可以“听”，可以“回答”，否则就只是声音而不是语言。

我认为在日常生活中，当一句具体的“言语”被说出后，它不是在等待一个语言结构意义上的回答，而是立刻进入社会结构，等待社会结构中他者的应答。

“我们中的他们，他们中的我们”是一件参与式的声音装置。受UCCA Edge委托创作，在展览“集光片羽”中展出。49只裸露式扬声器被悬吊在半空中，有规则地混乱发声。我给定了一套互动规范奠定了作品的“规则性”，包括某些语词的审查，但在规则的框架下，汇集的声音碎片却可以编织出了一张杂乱无章的关系之网。

观展的公众可以用手机扫二维码，登入作品的通讯页面，向作品发送“语音信息”。经作品的终端系统接收后，这条音频将通过一只隐蔽的大功率音响被功放在公共空间。紧接着，参与者将听见来自群体的“回应”——存储在系统中的过往49位参与者的声音将通过小功率的扬声器播放。新的参与者的声音也将在装置中存留，随机替换之前参与者留下的语音。随着越来越多的观众与装置发生互动，系统中存储的话语也将不断更新、替换。

通过声音装置作为中介，来自个体的表达进入公共空间，在声音的你呼我应中形成喧闹、不断流动的言语合流，如同是当下社会公共话语场域的微缩景观——在互联网传播技术的大众化与社交媒体的渗透之下，日常生活与私人领域的声音经由个体“发声”的动作进入互联网所象征的公共领域，激活了网络空间作为公共讨论场所的可能。然而在我看来，互联网讨论的“公共性”是有待商榷的，正如我之前提到的：当一句具体的言语被说出，它不是在等待一个语义上对应的回答，而是立刻进入社会结构，等待社会中他者的应答。

向作品讲述的每一句话必定在无数他人的声音中回响，而这种回响是否塑造了真正连结彼此的对话，亦或只是对话的假象、对话的虚空？`, images: ['images/wo01.jpg','images/wo02.jpg','images/wo03.jpg','images/wo04.jpg'] },
            { id: 'cong', title: '从_____到新天地', year: '2022', description: `混凝土，涂料，音频播放器，耳机

现代性以不断生产各种类型的空间在城市中表征自身。在这种生产中，城市的变化通常又以消失与新建作为特征。作为改革开放后上海城市土地开发的经典案例，新天地地产开发项目的新建一度蕴含着某些消失。是否可以在声音和听觉中寻找对于现代性与资本这个共生体进行批判的可能性，以及批判之后的余音。

这件作品是在我在上海新天地主办的燃冉艺术季驻地中创作的。我将日常居所空间、新天地的公共空间以及来往两地之间的城市空间作为聆听空间。邀请四位合作者，分别是独立音乐人、人类学家、3D声景设计师和游戏声音设计师共同参与创作。五位创作者从自己熟悉的地方（住宅或者工作场所），自选交通工具向新天地出发，在城市中移动的同时，对城市声音进行实地录音。基于这些实地录音，创作者独立创作各自的声音作品。这些声音作品被放置在混凝土装置中，该混凝土形态来自于新天地石库门旧区改造时，被拆除的住宅布局。

观众可以使用耳机随意捕捉混凝土装置中的五个声音作品。在作品中，新天地的声音本身是缺失的。观众听到的是城市其他地方的声音，但是在声音中这些其他地方却是跟新天地紧密联系在一起的。我想，就像一个词的意指和价值是在一个句子，一段话，一篇文章中才被赋予，新天地也必须在城市语境中，在与城市其他地方的连接中才能找到意义。

其实没有声音，这件作品的装置部分也可以成立。这好像是说出了一句断言，但这种断言似曾相识，仿佛正确的废话。有了声音，就有了某种可延续的出路，不是去再次印证已知的，而是给了探索以希望。`, images: ['images/xin01.jpg','images/xin02.jpg','images/xin03.jpg','images/xin04.jpg','images/xin05.jpg','images/xin06.jpg','images/xin07.jpg','images/xin08.jpg','images/xin09.jpg','images/xin10.jpg','images/xin11.jpg'] },
            { id: 'linju', title: '邻居', year: '2022', description: `家具，落地灯，信件，头戴式耳机，磁带播放机

在疫情期间，人们在社交平台讲述自己如何听到城市中鸟类的鸟叫。这成为了一种面对疫情负面情绪的主流叙事。在我看来，这种对城市的聆听陷入一种惯性的误区，人们常常容易将美妙的声音都归属于客体化的自然。在疫情期间则浪漫化为情感安慰剂。但天下无旧事，回顾一下自然史、博物学中的实地录音历史，就会发现新技术，特别是录音技术成熟发展之后，人类通过对声音的物质化，不断对自然的对象化和社会化，使自然成为某种文化资源与鉴赏对象，结果就是遗忘了人类本是属于自然的。

恰巧，在疫情期间，我在家里的阳台上录到了小区中每天早晨乌鸫的鸣叫和在不知哪家传出的唢呐练习。在我看来，乌鸫不代表自然，它和不知名的唢呐练习者一样，都是我的邻居。

我把整件事情写给了Benjamin Wood，就是那个主持新天地石库门改造的建筑师。他在最初设计之前做实地调研时拍过新天地原址太平桥弄堂的纪录片。那个纪录片的名字叫“邻居”。`, images: ['images/lin01.jpg','images/lin02.jpg'] },
            { id: 'yinyue', title: '音乐对我们来说到底意味着什么？', year: '2022', description: `含有实地录音、图像、文本朗读、现场音乐表演和食物的表演性讲座

我在回听自己的城市实地录音档案的过程中，发现无意识录到很多音乐。这些在城市公共空间内出现的音乐不是以艺术表演的形态出现在社会结构中的，不是一个鉴赏的对象或者文化商品。

我想提问，在音乐大部分时间扮演娱乐、休闲、情感代偿的今天，音乐对我们来说到底意味着什么？除了上述的肤浅单一的关系之外，我们和音乐还可以以怎样的方式产生联结？

“音乐对我们来说到底意味着什么？”是基于实地录音的讲座性表演。通过文本朗读，音乐表演，声音聆听和食物品尝，邀请观众对这个提问进行思考和切身感受。

图片记录的是2025年5月1日在上海当代艺术博物馆大阶梯的表演。

讲座表演：殷漪

音乐现场：殷漪，贝司/人声；吉他，卖卖；鼓，王宇东；小号，吕昀龙

舞台监督：郭晨星`, images: ['images/yin01.jpg','images/yin02.jpg','images/yin03.jpg','images/yin04.jpg','images/yin05.jpg','images/yin06.jpg','images/yin07.jpg','images/yin08.jpg','images/yin09.jpg','images/yin10.jpg','images/yin11.jpg','images/yin12.jpg'] },
            { id: 'shanghai', title: '上海', year: '2021', description: `跑步机，头戴式耳机，音频播放器，定制感应器，微信电脑，定制程序

和几个音乐家朋友聊天，大家的共识是，2000年初开始的中国内地实地录音实践，今天是日渐式微。在我看来，其中重要的一个原因是，当初的实地录音还是在用音乐的出版和流动方式进入社会。这些声音还是在被当做音乐去听。

我的问题是：如果录制下来的声音不是被当做音乐听的话，那么该如何去听？这里不是指听的对象的概念，也包括听的形式。

2021年我被邀请在上海的一座高楼的38层室内做一件作品。透过玻璃，可以看到30公里外浦东陆家嘴的标示性建筑。我当时在想，我鸟瞰城市，但听不到任何城市的声音。我又想到城市中在沿街玻璃后面那些在跑步机上运动的人。

于是我在38层高楼的展厅临窗放置了一个跑步机。当观众走上跑步机开始走动时，耳机里先是传来窗外实时的声音，然后随机播放我在上海录制的100个城市声音，每个声音时长一分钟。每个声音播放长度与观众运动速度相关，速度越快，声音切换的时间越短，频率越快。观众停止走动，声音也随之消失。

这件作品后来在商业体过街通道和美术馆咖啡厅都出现过。`, images: ['images/shanghai01.jpg','images/shanghai02.jpg','images/shanghai03.jpg','images/shanghai04.jpg'] },
            { id: 'nide', title: '你的声音里', year: '2021', description: `这是一件需要观众“进入”的作品。更确切地说，只有当观众的身体和意识同时进入艺术家所构想与制作的空间，作品才实时地生成。艺术家通过日常生活中最细微生命节律“行走——脚步声”为加入，使用不同的地面建筑材料，在美术馆的非常规展示空间内重新铺设地面。这些材料原样均现存于今天太原城内的不同地方，有久远的晋祠、文庙，也有刚刚新建的地铁。在重构的美术馆物理空间内，再次组建一个新的声音空间，艺术家尝试通过这种改变语境后的日常行为——行走，重新唤起观众的感知能力——听觉的，触觉的，也希望通过感知能再次回到我们的日常生活中。`, images: [] },
            { id: 'ruch', title: '如初', year: '2021', description: `旋转木马

2021年我被邀请参与一个乡村振兴文化项目。我被分配到贵州省榕江县载麻乡宰荡村。因为那里有一个国家级侗族大歌非遗传承人胡官美，那里有一支她主持的侗族大歌歌队。给我印象最深的是歌队中的加所儿童歌队。

我想为宰荡的儿童做一个东西，做一个本地村民可以日常使用的东西。同时在某种艺术语境到来的时候，它又具有一种艺术作品的特质。

它处于日常生活和艺术思考的交界处，两边都能够触摸到它。于是，据说起源于拜占庭的旋转木马被挪用到这里，宰荡侗族大歌的童声又被挪到至旋转木马周围。它们在此相遇，就如本地与外来的相遇。这种相遇是否会产生新的东西，我还不得而知。

童声以环绕立体声的方式围绕木马，亦如歌队在鼓楼里歌唱时的旋律。旋转木马转动的时候，便是一个梦生成的开始。最初我们都是喜欢做梦的。

在整个创作和制作过程中，我深刻地感受到了乡村振兴和乡村建设中的困境。我也深刻地感受到了他者的存在。在某些时刻他们让我羡慕与敬佩。`, images: ['images/ru01.jpg','images/ru02.jpg','images/ru03.jpg','images/ru04.jpg','images/ru05.jpg','images/ru06.jpg','images/ru07.jpg'] },
            { id: 'shesheng', title: '摄生', year: '2020', description: `肢体剧场

柏拉图在《斐多篇》对于书写的论述已经提出了与人类演化相伴的技术双面性，它既是解药也是毒药。在今天这种困境表现为人类感官功能和理性心智不断外化，不断被技术替代，结局是我们越来越不相信我们自己。面对技术统领的身体之外的制造欲望与满足欲望的循环机制，我们“身神分离”、“形神涣散”。

我开始练习中国养生功法，包括八段锦、六字诀、五禽戏。中国传统身体文化给我启发，我开始重新体悟“神”对于中国人的文化意义和生命意识价值，思考其与“身”的关系，进而寻找路径，调和生命与技术、身体与感知的连接。

“摄生”整体的表演内容和形式渐渐从中国传统功法与舞蹈中的步伐、动作、手势、仪态、空间和动静特征中浮现。我尝试着使用新的言说方式去连接“身”与“神”。

导演：殷漪

动作编导：殷漪，刘亚囡

舞者：刘亚囡，王少筠

现场音乐：中提琴/矫英，钢片琴/王田，吉他/卖卖，中音萨克斯/照骏园

灯光：高叶林`, images: ['images/she01.jpg','images/she02.jpg','images/she03.jpg','images/she04.jpg','images/she05.jpg','images/she06.jpg','images/she07.jpg','images/she08.jpg','images/she09.jpg','images/she10.jpg','images/she11.jpg','images/she12.jpg','images/she13.jpg','images/she14.jpg','images/she15.jpg','images/she16.jpg','images/she17.jpg','images/she18.jpg','images/she19.jpg','images/she20.jpg','images/she21.jpg','images/she22.jpg'], video: 'https://player.vimeo.com/video/891867031' },
            { id: 'zhenshen', title: '真身', year: '2019', description: `综合材料表演

有一次演出，看着台下的观众，我在想这些人到底是谁？他们知道我的名字，而我对他们一无所知。

他们是匿名的，但是观众这个身份也是分配给他们的。从微观政治的角度看，观众是缺席的。我想把抽象的，处于被动接受位置的观众变成主动表演参与者。

《真身》采用的是一对一表演形式。我将使用如同中国传统中医“一人一方”的形式与观演者共同创造表演内容。表演内容围绕声音展开，包括但不限于：历史经典声音作品演绎，个人电脑音乐现场，电子硬件与物件混合表演，实地录音行走，基于实地录音的声音景观营造，内外都听觉空间营造，等等。

在演出前，观演者需要告诉我他们的名字，交纳出席保证金，签署相关协议。

在演出后，我会基于自身主观感受为观演者配置一款以观演者名字命名的草本茶饮，以建构观演者的味觉形象，通过茶饮传达并展示这一形象。

正如作品名字“真身”，我想邀请观演者以真身出现在面对面中，在表演中共同演绎表演中的观演关系，同时改变表演作品的生产方式，思考作品表演过程中各自的权力，责任与义务。`, images: ['images/01.jpg','images/02.jpg','images/03.jpg','images/04.jpg','images/05.jpg','images/06.jpg','images/07.jpg','images/08.jpg','images/09.jpg','images/10.jpg','images/11.jpg','images/12.jpg','images/13.jpg','images/14.jpg','images/15.jpg'] },
            { id: 'xiangxi', title: '向西', year: '2019', description: `5频影像，8通道声音

这件作品由2019年上海城市空间艺术季委托创作。

我对于上海的一个关注点是苏州河。相比较黄浦江，苏州河与上海市民的日常生活更加息息相关。母亲曾经的一句话让我念念不忘，她说：“我小姑娘的时候，还坐渡船过苏州河”。如今渡船已经消失，我对苏州河上的桥却产生了浓厚的兴趣。

《向西》是以苏州河上的四川路桥为场所创作的5频8声道声音影像装置。我邀请了音乐家照骏园在不同时间段内在四川路桥上表演，表演时演奏方向始终对着西面，这是苏州河源头的方向。我让照骏园在表演中想象与不同时间的自己合奏自由即兴音乐。我觉得和城市声音匹配的是自由即兴音乐。同期声录音，既记录了城市声音，也收录了音乐家的演奏。我构想把音乐注入城市声音，用混音的手法通过照骏园的自由即兴音乐把城市中不同时间不同空间的声音和影像编制起来，营造出浅吟式的城市场所。

四川路桥是我儿时的记忆。我想邀请观众在展览现场用自己的身体和意识去构建出在时间空间重叠中溢出的四川路桥。`, images: ['images/xiang01.jpg','images/xiang02.jpg','images/xiang03.jpg','images/xiang04.jpg','images/xiang05.jpg','images/xiang06.jpg','images/xiang07.jpg','images/xiang08.jpg','images/xiang09.jpg','images/xiang10.jpg'] },
            { id: 'liuge', title: '聆听的六个姿态', year: '2019', description: `信件，消声耳机，耳机，网络存储音频文件

我给观众写了六封信。

这六封信有信使在不同的地点交给观众，引领观众在具有历史特征的特定城市场所间移动，用听觉去体验和回应声音艺术史上诸多观念，包括来自John Cage, Max Neuhaus及Pierre Schaeffer的作品和观点。

如果聆听不只是一种修辞，一种玄思，那一定是因为身体的出场。身体出现在一个位置上，一个空间由此生成。聆听不是只关乎听觉系统。聆听实实在在地发生在身体之中。聆听一旦发生，随即穿过身体的边界。一个姿态是对身体的塑形，也给予聆听一种框架。

聆听是线索，都市空间是表演场地。`, images: ['images/liu01.jpg','images/liu02.jpg','images/liu03.jpg','images/liu04.jpg','images/liu05.jpg','images/liu06.jpg','images/liu07.jpg','images/liu08.jpg','images/liu09.jpg','images/liu10.jpg','images/liu11.jpg','images/liu12.jpg'], video: 'https://player.vimeo.com/video/390302614' },
            { id: 'shige', title: '十个墙角', year: '2018', description: `影像，无声

一个空间不是界面的围合。

一个事件发生，一个空间生成。`, images: ['images/shi01.jpg'], video: 'https://player.vimeo.com/video/257713205' },
            { id: 'meishuguan', title: '美术馆', year: '2018', description: `单频影像，立体声

声音拥有一对穿越边界的能力。

声音在穿越边界的同时，也生成其自身的边界。但这边界时刻变化、模糊不清。

“用声音的方式”去使用一座尚未完工的美术馆。拍摄一部由声音驱动的声音艺术影像作品。

这件作品是受建筑师柳亦春的邀请为他设计的台州美术馆创作的。柳亦春想在美术馆还没有完工之前用艺术去记录。而我的想法是区别于放置展品，用别样的艺术方式去使用美术馆。这也是我尝试用“声音驱动影像”的开始。`, images: ['images/mei01.jpg'], video: 'https://player.vimeo.com/video/722087139' },
            { id: 'ditu', title: '地图', year: '2018', description: `4频影像，立体声

身为现代舞者的妻子再次怀孕。

我想和妻子以及未出现的孩子一起进行了一次即兴表演。4频影像分别是，绿萤石，菱锰矿原石，蓝铜矿原石和口红记录下来的胎动痕迹。声音是我在地中海和印度洋海滩上使用水下拾音器录制。水下拾音器在海水涨落间录下水面下和水面上的声音，还有与海滩砂砾的摩擦。

这是一种关于“摩擦”的直接感受：海水从沙滩上褪去，一些孩子在沙滩上嬉戏的声音。`, images: ['images/ditu01.jpg','images/ditu02.jpg','images/ditu03.jpg','images/ditu04.jpg','images/ditu05.jpg','images/ditu06.jpg','images/ditu07.jpg'] },
            { id: 'yici', title: '一次上海的旅程', year: '2017', description: `影像，立体声

我一直要求女儿说上海话，至少在家里。理由很简单，上海人应该说上海话。

她4岁那年，我们一起坐地铁。她突然问我，为什么他们不说上海话？我意识到女儿指的是地铁报站语音，只用普通话和英语。

在社会性公共空间内，组织化系统化后的声音不但规则我们的身体，还规则我们的知识和文化。在上海，上海话被排斥在官方管理的上海最大的流动公共空间——轨道交通之外。在这个公共空间内信息传达不能用上海话。上海话在这里被隐形地贬损和禁止。

在2017年春节期间，我邀请我的朋友经济学家梁捷担任《一次上海的旅程》的播报员。上海轨道交通4号线上，每站报站语音播完普通话和英语之后，梁捷都播放预先录制好的同样播报内容的上海话。

影像最终呈现为，没有语音播报的时候，画面是一片模糊；有普通话和英语语音播报的时候，画面可以看出人影；当上海话出现时候，梁捷的形象清晰可以。

我说过的，上海人应该说上海话。`, images: ['images/yi01.jpg','images/yi02.jpg','images/yi03.jpg'] },
            { id: 'hailang', title: '海浪', year: '2016', description: `落地式电扇，定时器

曾经有策展人问我，是否有什么东西是不可被见到而只能被听到。我回答：风。

多个落地电扇摆放成的矩形，运行和静止交替进行，时隔5分钟。通过精心地摆放设计，电扇所产生的风只在矩形内部运动、消解。当相对的电扇面对面掠过时，不同运动方向的风碰撞产生的声音混合在一起。在这个作品中，声音和风来自同一个源头——空气的运动。声音的生成和风的消解同时发生。在此，生成即是消解，消解即是生成。`, images: ['images/hai01.jpg','images/hai02.jpg'] },
            { id: 'liwu', title: '礼物', year: '2016-2021', description: `信件，户外扬声器，功放，定制蓝牙音频播放器

2014年我在德国汉堡艺术驻地。当地朋友告诉我汉堡火车站播放古典音乐来驱赶流浪汉。我疑惑和震惊。

据资料显示，从2008年开始，德国铁路公司在汉堡中央车站入口广场处播放古典音乐，如维瓦尔第的《四季》。以此来驱赶在该区域停留的流浪人员。官方称这些流浪人员有与毒品相关的犯罪行为。据当地媒体Hamburger Abendblatt 一汉堡晚报报道，这一措施效果显著。

《礼物》在公共空间内建立独有的听觉空间，默认状态下，该空间内一直循环播放《四季》音乐。依据不同的场所特征，观众会看到我给他们的一封信。里面描述了我在汉堡的所见所闻。然后邀请他们用手机连接场地中名为“礼物”无线蓝牙设备，播放他们自己想听的音乐。当他们的音乐在空间中响起，《四季》就会消失，当他们的音乐结束，《四季》就会再度响起。

谁来决定公共空间内被听到的声音内容呢？《礼物》是对汉堡中央火车站声音播放的反向与行动，是对于不同语境下公共空间声音运行逻辑与机制的探索和实验。`, images: ['images/li01.jpg','images/li02.jpg','images/li03.jpg','images/li04.jpg'] },
            { id: 'dinghai', title: '20140901-20140930', year: '2014', description: `玻璃罐，裸露式扬声器，音频播放器，功放，阿司匹林

定海桥地区是上海市区仅存的几个大面积旧区，有着丰富的历史，在民间也流传大量灰色铁事，宛如现代上海的一个久远的桥苑。在接收到创作邀请后，我陷于一种矛盾的心理。因为我小时候也是生长类似的旧区中，原来成长的旧区已经消失，再次回到相似的环境中，我无法做到拥抱过去，也不可能以外来者猎奇眼光去观看。

这里的道路大多数情况下是湿的，因为室内没有排水系统；这里的人相互熟悉，所谓的公共生活丰富，但却缺乏私人和公共空间之间的边界意识；空气里弥漫着熟悉的食物味道，但卫生状况堪忧；白天和黑夜是两个不同的世界。

从2014年9月1日到30日，我们去定海桥，不同的时间段，在不同的地点录音。这些声音被单个放在密封的玻璃罐里，外面贴着录制声音的时间地点天气，每个声音旁放有一片阿司匹林。透过玻璃，喇叭清晰可以，但是声音是模糊的，就像被现代城市抛弃的压抑的旧区。`, images: ['images/201401.jpg','images/201402.jpg','images/201403.jpg','images/201404.jpg'] },
            { id: 'weiliao', title: '为了告别的聚会', year: '2013-2019', description: `50年前，他们响应毛主席号召上山下乡。50年后，他们回到自己出生的城市，在公园里一起集体歌唱。为什么200个退休老人会在每个周末聚集在公园里集体唱他们时代的歌曲呢？为什么他们选择使用发声的方式呢？为什么他们选择公园呢？这宛如一次为了告别的聚会。

“为了告别的聚会”是一件带有音乐表演的声音装置。照片和8个封闭在密封玻璃罐里的扬声器排放在缓慢转动的自动旋转圆桌上。仿佛是一个聚餐的场景。每个扬声器都在循环播放一首由艺术家实地录音的方式录制的，由鲁迅公园自发组织的唱歌集体演唱的歌曲。在封闭的罐子里，所有的声音模糊而压抑，在自动旋转圆桌的转动下形成一个变化的声音。每隔30分钟，现场会有小号演奏员演奏艺术家创作的音乐，与玻璃罐里的扬声器共同发声。`, images: ['images/wei01.jpg','images/wei02.jpg','images/wei03.jpg','images/wei04.jpg','images/wei05.jpg','images/wei06.jpg'], video: 'https://player.vimeo.com/video/716272868' },
            { id: 'moshnegren', title: '陌生人', year: '2013', description: `双频影像，无声

2013年，我迎来第一个孩子。在孩子未降生时，我渐渐感觉这是一个陌生人。我将遇到一个陌生人。这种陌生感一定来自于我对孩子的一无所知。同时理智又告诉我这个陌生人将是我最亲近的人，这更加加深了陌生感。我与父亲母亲的相识是渐进的，我与孩子的相识是突如其来的。我有很多疑惑和担忧。

双频影像中左边是妻子怀孕的身体，右边是看似电影片尾滚动的演员表。但实际上滚动是我认为孩子可能拥有的社会身份。`, images: ['images/mo01.jpg','images/mo02.jpg'] },
            { id: 'heliu', title: '你可以无数次聆听同一条河流', year: '2012-2016', description: `文本，录音机，磁带，裸露式喇叭，音频播放器，功放

声音是与时间黏连在一起的能量变化。与声音黏连在一起的不是抽象化后的脉冲时间。是延绵，是时间流。人类开始获得记录声音流的技术时，也开始记录下时间流。最初所使用的模拟技术和存储声音流的介质都很好的显示了“流”的概念。在蜡筒，钢丝，唱盘，磁带上保存下的能量变化都是连续的。至今为止所有的影像记录技术和声音数字技术则都是离散系统，所保持的是时间切片，你所看到的听到了是时间切片的序列。

聆听磁带播放的声音，听到的是声音流，经验到的是时间流。`, images: ['images/ni02.jpg','images/ni03.jpg'] },
            { id: 'sanfenzhong', title: '三分钟', year: '2008|2020', description: `双频影像，立体声

2008年5月19日下午，我在上海市延安西路凯旋路交叉天桥上拍摄了全国为汉川地震默哀3分钟的影像。之后我邀请了两位女性朋友尽力吸气然后用手捂住嘴发声，并在发声时尽自己最大的可能把气息吐完。这些近于极限的呼气和发声被记录，并用在为汉川地震默哀3分钟所做的音乐中。

12年后中国再次响起默哀的防空警报声以悼念在新冠疫情中去世的人们，我在2020年4月4号上午10点在上海市南京东路步行街上再次拍摄3分钟的影像。

在声音中，一个情感共同体被创建出来。`, images: ['images/san01.jpg','images/san02.jpg','images/san03.jpg','images/san04.jpg'], video: 'https://player.vimeo.com/video/61903048' }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const workId = urlParams.get('id');
        const work = works.find(w => w.id === workId);

        const container = document.getElementById('work-content');

        if (!work) {
            container.innerHTML = '<p style="color:#d0d8e0;">作品不存在或ID错误。</p>';
        } else {
            let imagesHtml = '';
            if (work.images && work.images.length > 0) {
                const imageItems = work.images.map(img => `
                    <div class="image-item">
                        <img src="${img}" alt="${work.title}">
                    </div>
                `).join('');
                imagesHtml = `
                    <div class="work-images">
                        <div class="image-list">
                            ${imageItems}
                        </div>
                    </div>
                `;
            } else {
                imagesHtml = `
                    <div class="work-images">
                        <div class="image-list">
                            <div class="image-placeholder">暂无图片</div>
                        </div>
                    </div>
                `;
            }

            let videoHtml = '';
            if (work.video) {
                videoHtml = `
                    <div class="video-container">
                        <iframe src="${work.video}?title=0&byline=0&portrait=0" allowfullscreen></iframe>
                    </div>
                `;
            }

            const html = `
                <div class="work-detail">
                    <div class="work-info">
                        <div class="work-title">${work.title}</div>
                        <div class="work-year">${work.year}</div>
                        <div class="work-description">${work.description.replace(/\n/g, '<br>')}</div>
                    </div>
                    ${imagesHtml}
                </div>
                ${videoHtml}
            `;
            container.innerHTML = html;
        }

        // ================== 新增：语言切换携带 id 参数 ==================
        const currentId = urlParams.get('id');
        if (currentId) {
            const enLink = document.querySelector('a[href="work_en.html"]');
            if (enLink) {
                enLink.href = `work_en.html?id=${currentId}`;
            }
        }
        // ============================================================
    </script>
</body>
</html>
