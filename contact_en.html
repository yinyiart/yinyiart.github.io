<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yin Yi · Contact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #9c9ca5;
            font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
            color: #53585f;
            line-height: 1.6;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: scroll;   /* 与中文页面一致，防止滚动条跳动 */
        }

        /* 导航栏布局与文字英文页面一致，但颜色适配浅色主题 */
        .top-nav {
            position: absolute;
            top: 40px;
            right: 20px;
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #53585f;
            z-index: 100;
        }
        .top-nav a {
            color: #53585f;
            text-decoration: none;
            transition: color 0.2s;
        }
        .top-nav a:hover,
        .top-nav a.active {
            color: #1f2c35;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 5%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-top: 150px;
        }

        .contact-text {
            text-align: center;
            font-size: 1rem;
            color: #53585f;
            line-height: 1.8;
        }

        .contact-text a {
            color: #53585f;
            text-decoration: none;
            border-bottom: 1px dotted #a0b3c5;
            transition: color 0.2s, border-bottom-color 0.2s;
        }

        .contact-text a:hover {
            color: #1f2c35;
            border-bottom-color: #1f2c35;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }
            .top-nav {
                position: static;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
                margin-bottom: 30px;
                width: 100%;
            }
            .top-nav a {
                padding: 6px 0;
                white-space: nowrap;
                font-size: 0.8rem;
                color: #53585f;
            }
            .container {
                padding: 0 8%;
                padding-top: 0;
            }
            .contact-text {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="index_en.html">Yin Yi</a>
        <a href="musician_en.html">Musician</a>
        <a href="artist_en.html">Artist</a>
        <a href="curator_en.html">Curator</a>
        <a href="writing_en.html">Texts</a>
        <a href="about_en.html">CV</a>
        <a href="contact_en.html" class="active">Contact</a>
        <a href="contact.html">CN</a>
    </div>

    <div class="container">
        <div class="contact-text">
            You can reach me at 
            <a href="mailto:audioripple@gmail.com">audioripple(at)gmail.com</a>.
        </div>
    </div>
</body>
</html>
