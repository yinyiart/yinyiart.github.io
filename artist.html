<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>殷漪 · 艺术家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #42586E;      /* R66 G88 B110 */
            font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
            color: #f0f4f8;
            line-height: 1.6;
            padding: 40px 20px;
            position: relative;
        }

        .top-nav {
            position: absolute;
            top: 40px;
            right: 20px;
            display: flex;
            gap: 30px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d0d8e0;
            z-index: 100;
        }
        .top-nav a {
            color: #d0d8e0;
            text-decoration: none;
            transition: color 0.2s;
        }
        .top-nav a:hover,
        .top-nav a.active {
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5%;
            padding-top: 150px;        /* 与文字、简历页面统一 */
        }

        .main-content {
            display: flex;
            gap: 40px;
        }

        .tag-panel {
            flex: 0 0 160px;
            position: sticky;
            top: 100px;
            align-self: flex-start;
        }
        .tag-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tag {
            padding: 4px 0;
            font-size: 0.85rem;
            line-height: 1.2;
            cursor: pointer;
            transition: 0.2s;
            color: #d0d8e0;
            background: transparent;
            border: none;
            text-align: left;
        }
        .tag:hover {
            color: #ffffff;
        }
        .tag.active {
            color: #ffffff;
            font-weight: 500;
        }

        .works-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .work-card {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .work-image {
            width: 100%;
            aspect-ratio: 3 / 2;
            background-color: #7a8088;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d0d8e0;
            font-size: 0.9rem;
            overflow: hidden;
        }
        .work-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .work-info {
            padding: 0;
        }

        .work-title {
            font-size: 1.0rem;
            font-weight: 400;
            color: #f0f4f8;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .work-year {
            font-size: 0.85rem;
            color: #d0d8e0;
            margin-bottom: 6px;
        }

        .work-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .work-tag {
            font-size: 0.7rem;
            color: #d0d8e0;
            background: transparent;
            padding: 0;
            border: none;
        }

        .work-card.hidden {
            display: none;
        }

        @media (max-width: 800px) {
            .main-content {
                gap: 30px;
            }
            .tag-panel {
                flex: 0 0 140px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }
            .top-nav {
                position: static;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
                margin-bottom: 30px;
                width: 100%;
            }
            .top-nav a {
                padding: 6px 0;
                white-space: nowrap;
                color: #d0d8e0;
                font-size: 0.85rem;
            }
            .container {
                padding: 0 8%;
                padding-top: 0;          /* 移动端重置顶部间距 */
            }
            .main-content {
                flex-direction: column;
                gap: 20px;
            }
            .tag-panel {
                flex: auto;
                position: static;
                width: 100%;
                overflow-x: auto;
                white-space: nowrap;
                padding-bottom: 10px;
                -webkit-overflow-scrolling: touch;
            }
            .tag-list {
                flex-direction: row;
                flex-wrap: nowrap;
                gap: 15px;
            }
            .tag {
                padding: 4px 0;
                font-size: 0.8rem;
                white-space: nowrap;
            }
            .works-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .work-image {
                height: 200px;
                width: 100%;
                aspect-ratio: auto;
            }
            .work-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .work-title {
                font-size: 1.0rem;
            }
            .work-year {
                font-size: 0.8rem;
            }
            .work-tag {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="index.html">殷漪</a>
        <a href="musician.html">音乐家</a>
        <a href="artist.html" class="active">艺术家</a>
        <a href="curator.html">策展人</a>
        <a href="writing.html">文字</a>
        <a href="about.html">简历</a>
        <a href="index_en.html">EN</a>
    </div>

    <div class="container">
        <div class="main-content">
            <div class="tag-panel">
                <div class="tag-list" id="tag-panel">
                    <div class="tag active" data-tag="all">全部</div>
                    <div class="tag" data-tag="zhesi">哲思</div>
                    <div class="tag" data-tag="public-space">公共空间</div>
                    <div class="tag" data-tag="public-memory">公共记忆</div>
                    <div class="tag" data-tag="body">身体性</div>
                    <div class="tag" data-tag="media">媒介</div>
                    <div class="tag" data-tag="sound-image">声音驱动影像</div>
                    <div class="tag" data-tag="performance">表演</div>
                    <div class="tag" data-tag="field-recording">实地录音</div>
                </div>
            </div>

            <div class="works-grid" id="works-grid">
                <!-- 由 JavaScript 动态生成 -->
            </div>
        </div>
    </div>

    <script>
        const works = [
            { id: 'gan', title: '感官的流动', year: '2025', image: 'images/flux15.jpg', tags: ['public-space', 'public-memory', 'media', 'field-recording'] },
            { id: 'ligeti', title: '利盖蒂的100节拍器', year: '2025', image: 'images/ligeti01.jpg', tags: ['body', 'performance'] },
            { id: 'wo', title: '我听到了', year: '2023', image: 'images/listening08.jpg', tags: ['zhesi', 'public-space', 'body', 'public-memory', 'performance'] },
            { id: 'guishi', title: '归时始无声', year: '2023', image: 'images/gui01.jpg', tags: ['zhesi', 'performance'] },
            { id: 'bumian', title: '不眠电台', year: '2023', image: 'images/bu01.jpg', tags: ['public-memory', 'media'] },
            { id: 'women', title: '我们中的他们，他们中的我们', year: '2022', image: 'images/wo03.jpg', tags: ['public-space', 'media', 'performance'] },
            { id: 'cong', title: '从_____到新天地', year: '2022', image: 'images/xin04.jpg', tags: ['public-space', 'public-memory', 'field-recording'] },
            { id: 'linju', title: '邻居', year: '2022', image: 'images/lin03.jpg', tags: ['public-memory'] },
            { id: 'yinyue', title: '音乐对我们来说到底意味着什么？', year: '2022', image: 'images/yin13.jpg', tags: ['zhesi', 'performance', 'field-recording'] },
            { id: 'shanghai', title: '上海', year: '2021', image: 'images/shanghai04.jpg', tags: ['public-space', 'public-memory', 'body', 'performance', 'field-recording'] },
            { id: 'ruch', title: '如初', year: '2021', image: 'images/ru01.jpg', tags: ['public-space', 'public-memory', 'performance'] },
            { id: 'shesheng', title: '摄生', year: '2020', image: 'images/she12.jpg', tags: ['zhesi', 'body', 'performance'] },
            { id: 'zhenshen', title: '真身', year: '2019', image: 'images/05.jpg', tags: ['zhesi', 'body', 'media', 'performance'] },
            { id: 'xiangxi', title: '向西', year: '2019', image: 'images/xiang04.jpg', tags: ['public-space', 'public-memory', 'sound-image', 'performance', 'field-recording'] },
            { id: 'liuge', title: '聆听的六个姿态', year: '2019', image: 'images/liu01.jpg', tags: ['public-space', 'performance'] },
            { id: 'shige', title: '十个墙角', year: '2018', image: 'images/shi01.jpg', tags: ['zhesi'] },
            { id: 'meishuguan', title: '美术馆', year: '2018', image: 'images/mei01.jpg', tags: ['body', 'sound-image'] },
            { id: 'ditu', title: '地图', year: '2018', image: 'images/ditu01.jpg', tags: ['body', 'sound-image', 'field-recording'] },
            { id: 'yici', title: '一次上海的旅程', year: '2017', image: 'images/yi01.jpg', tags: ['public-space', 'public-memory', 'sound-image'] },
            { id: 'hailang', title: '海浪', year: '2016', image: 'images/hai03.jpg', tags: ['zhesi', 'performance'] },
            { id: 'liwu', title: '礼物', year: '2016-2021', image: 'images/li02.jpg', tags: ['public-space', 'media', 'performance'] },
            { id: 'dinghai', title: '20140901-20140930', year: '2014', image: 'images/201402.jpg', tags: ['public-space', 'public-memory', 'field-recording'] },
            { id: 'weiliao', title: '为了告别的聚会', year: '2013-2019', image: 'images/wei01.jpg', tags: ['public-space', 'public-memory', 'field-recording'] },
            { id: 'moshnegren', title: '陌生人', year: '2013', image: 'images/mo01.jpg', tags: ['body'] },
            { id: 'heliu', title: '你可以无数次聆听同一条河流', year: '2012-2016', image: '', tags: ['zhesi', 'field-recording'] },
            { id: 'sanfenzhong', title: '三分钟', year: '2008|2020', image: 'images/san03.jpg', tags: ['public-memory', 'performance'] }
        ];

        const tagNames = {
            'zhesi': '哲思',
            'public-space': '公共空间',
            'public-memory': '公共记忆',
            'body': '身体性',
            'media': '媒介',
            'sound-image': '声音驱动影像',
            'performance': '表演',
            'field-recording': '实地录音'
        };

        const grid = document.getElementById('works-grid');
        function renderWorks(filterTag = 'all') {
            let html = '';
            works.forEach(work => {
                if (filterTag !== 'all' && !work.tags.includes(filterTag)) return;

                const imgHtml = work.image ? `<img src="${work.image}" alt="${work.title}">` : '<span>图片待上传</span>';
                const tagSpans = work.tags.map(tag => {
                    return `<span class="work-tag">${tagNames[tag] || tag}</span>`;
                }).join(' · ');

                html += `
                    <div class="work-card" data-id="${work.id}" data-tags="${work.tags.join(',')}">
                        <div class="work-image">${imgHtml}</div>
                        <div class="work-info">
                            <div class="work-title">${work.title}</div>
                            <div class="work-year">${work.year || '年份未知'}</div>
                            <div class="work-tags">${tagSpans}</div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            document.querySelectorAll('.work-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = this.dataset.id;
                    window.location.href = `work.html?id=${id}`;
                });
            });
        }

        renderWorks();

        const tags = document.querySelectorAll('.tag');
        tags.forEach(tagEl => {
            tagEl.addEventListener('click', function() {
                tags.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderWorks(this.dataset.tag);
            });
        });
    </script>
</body>
</html>
