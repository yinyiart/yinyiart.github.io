<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>殷漪 · 艺术家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2a333c;  /* 深蓝灰基底 */
            font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
            color: #eef2f5;
            line-height: 1.5;
            padding: 0;
        }

        /* 整体布局容器 */
        .site-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        /* 顶部导航 - 简洁文字 */
        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            margin-bottom: 60px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #a0b3c5;
        }
        .top-nav a {
            color: #a0b3c5;
            text-decoration: none;
            transition: color 0.2s;
        }
        .top-nav a:hover,
        .top-nav a.active {
            color: white;
        }

        /* 主内容区：左侧脉络 + 右侧作品网格 */
        .main-content {
            display: flex;
            gap: 40px;
        }

        /* 左侧脉络面板 */
        .tag-panel {
            flex: 0 0 160px;
            position: sticky;
            top: 40px;
            align-self: flex-start;
        }
        .tag-panel h3 {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #a0b3c5;
            text-transform: uppercase;
        }
        .tag-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tag {
            padding: 6px 0 6px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            color: #a0b3c5;
            border-left: 3px solid transparent;
            background: transparent;
        }
        .tag:hover {
            color: white;
            background: rgba(255,255,255,0.05);
        }
        .tag.active {
            color: white;
            border-left-width: 5px;
            background: rgba(255,255,255,0.1);
        }
        .tag[data-tag="all"] { border-left-color: #a0b3c5; }
        .tag[data-tag="zhesi"] { border-left-color: #5f6f80; }
        .tag[data-tag="public-space"] { border-left-color: #2c3e4f; }
        .tag[data-tag="public-memory"] { border-left-color: #8b5a2b; }
        .tag[data-tag="body"] { border-left-color: #b85e3a; }
        .tag[data-tag="media"] { border-left-color: #6a4e7a; }
        .tag[data-tag="sound-image"] { border-left-color: #2f6f5e; }
        .tag[data-tag="performance"] { border-left-color: #3a7ca5; }
        .tag[data-tag="field-recording"] { border-left-color: #a0b3c5; }

        /* 右侧作品网格 */
        .works-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* 作品卡片 */
        .work-card {
            background: #1f2a33;
            border: 1px solid #3a4752;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .work-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-color: #5f6f80;
        }

        .work-image {
            width: 100%;
            aspect-ratio: 4 / 3;  /* 统一比例，可根据需要调整 */
            background-color: #2e3b4e;  /* 占位色 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0b3c5;
            font-size: 0.8rem;
        }
        .work-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .work-info {
            padding: 16px 14px;
        }

        .work-title {
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 6px;
            color: #eef2f5;
        }
        .work-year {
            font-size: 0.85rem;
            color: #a0b3c5;
            margin-bottom: 10px;
        }
        .work-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .work-tag {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            background: #2a3a45;
            color: #c0d0e0;
            border-left: 2px solid transparent;
        }
        /* 每个脉络标签的左侧颜色条（在卡片内用小圆点或线条表示） */
        .work-tag[data-tag="zhesi"] { border-left-color: #5f6f80; }
        .work-tag[data-tag="public-space"] { border-left-color: #2c3e4f; }
        .work-tag[data-tag="public-memory"] { border-left-color: #8b5a2b; }
        .work-tag[data-tag="body"] { border-left-color: #b85e3a; }
        .work-tag[data-tag="media"] { border-left-color: #6a4e7a; }
        .work-tag[data-tag="sound-image"] { border-left-color: #2f6f5e; }
        .work-tag[data-tag="performance"] { border-left-color: #3a7ca5; }
        .work-tag[data-tag="field-recording"] { border-left-color: #a0b3c5; }

        /* 暂无图片时的占位文字 */
        .no-image {
            color: #a0b3c5;
        }

        /* 筛选隐藏 */
        .work-card.hidden {
            display: none;
        }

        /* 页脚留白 */
        .footer {
            margin-top: 60px;
            text-align: center;
            color: #5f6f80;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- 导航 -->
        <div class="top-nav">
            <a href="index.html">殷漪</a>
            <a href="musician.html">音乐家</a>
            <a href="artist.html" class="active">艺术家</a>
            <a href="curator.html">策展人</a>
            <a href="writing.html">写作</a>
            <a href="about.html">关于</a>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 左侧脉络面板 -->
            <div class="tag-panel">
                <h3>脉络</h3>
                <div class="tag-list" id="tag-panel">
                    <div class="tag active" data-tag="all">全部</div>
                    <div class="tag" data-tag="zhesi">哲思</div>
                    <div class="tag" data-tag="public-space">公共空间</div>
                    <div class="tag" data-tag="public-memory">公共记忆</div>
                    <div class="tag" data-tag="body">身体性</div>
                    <div class="tag" data-tag="media">媒介</div>
                    <div class="tag" data-tag="sound-image">声音驱动影像</div>
                    <div class="tag" data-tag="performance">表演</div>
                    <div class="tag" data-tag="field-recording">实地录音</div>
                </div>
            </div>

            <!-- 右侧作品网格 -->
            <div class="works-grid" id="works-grid">
                <!-- 每个作品卡片由 JavaScript 动态生成，避免手动重复 -->
            </div>
        </div>

        <div class="footer">© 殷漪</div>
    </div>

    <script>
        // 作品数据（与之前相同，请根据实际脉络修改）
        const works = [
            { id: 'sanfenzhong', title: '三分钟', year: '2008|2020', image: '', tags: ['public-memory', 'performance'] },
            { id: 'wuti', title: '无题（乐谱一）', year: '2011', image: '', tags: ['zhesi', 'media'] },
            { id: 'heliu', title: '你可以无数次聆听同一条河流', year: '2012-2016', image: '', tags: ['zhesi', 'field-recording'] },
            { id: 'weiliao', title: '为了告别的聚会', year: '2013-2019', image: '', tags: ['public-space', 'public-memory', 'field-recording'] },
            { id: 'moshnegren', title: '陌生人', year: '', image: '', tags: ['body'] },
            { id: 'dinghai', title: '20140901-20140930', year: '2014', image: '', tags: ['public-space', 'public-memory', 'field-recording'] },
            { id: 'hailang', title: '海浪', year: '2016', image: '', tags: ['zhesi', 'performance'] },
            { id: 'tingdao', title: '你听到过海', year: '2016', image: '', tags: ['public-space', 'media', 'field-recording'] },
            { id: 'liwu', title: '礼物', year: '2016-2021', image: '', tags: ['public-space', 'media', 'performance'] },
            { id: 'yici', title: '一次上海的旅程', year: '2017', image: '', tags: ['public-space', 'public-memory', 'sound-image'] },
            { id: 'ditu', title: '地图', year: '2018', image: '', tags: ['body', 'sound-image', 'field-recording'] },
            { id: 'erzhai', title: '耳宅声景', year: '2018', image: '', tags: ['public-space', 'field-recording'] },
            { id: 'shige', title: '十个墙角', year: '2018', image: '', tags: ['zhesi'] },
            { id: 'meishuguan', title: '美术馆', year: '2018', image: '', tags: ['body', 'sound-image'] },
            { id: 'zhenshen', title: '真身', year: '2019', image: '', tags: ['zhesi', 'body', 'media', 'performance'] },
            { id: 'xiangxi', title: '向西', year: '2019', image: '', tags: ['public-space', 'public-memory', 'sound-image', 'performance', 'field-recording'] },
            { id: 'liuge', title: '聆听的六个姿态', year: '2019', image: '', tags: ['public-space', 'performance'] },
            { id: 'shesheng', title: '摄生', year: '2020', image: '', tags: ['zhesi', 'body', 'performance'] },
            { id: 'shanghai', title: '上海', year: '2021', image: '', tags: ['public-space', 'public-memory', 'body', 'performance', 'field-recording'] },
            { id: 'nide', title: '你的声音里', year: '2021', image: '', tags: ['zhesi', 'body'] },
            { id: 'ruch', title: '如初', year: '2021', image: '', tags: ['public-space', 'public-memory', 'performance'] },
            { id: 'women', title: '我们中的他们，他们中的我们', year: '2022', image: '', tags: ['public-space', 'media', 'performance'] },
            { id: 'cong', title: '从 到新天地', year: '2022', image: '', tags: ['public-space', 'public-memory', 'field-recording'] },
            { id: 'linju', title: '邻居', year: '2022', image: '', tags: ['public-memory'] },
            { id: 'yinyue', title: '音乐对我们来说到底意味着什么？', year: '2022', image: '', tags: ['zhesi', 'performance', 'field-recording'] },
            { id: 'guishi', title: '归时始无声', year: '2023', image: '', tags: ['zhesi', 'performance'] },
            { id: 'bumian', title: '不眠电台', year: '2023', image: '', tags: ['public-memory', 'media'] },
            { id: 'wo', title: '我听到了', year: '2023', image: '', tags: ['zhesi', 'public-space', 'body', 'public-memory', 'performance'] },
            { id: 'yexiang', title: '野响', year: '2024', image: '', tags: ['public-space', 'body'] },
            { id: 'gan', title: '感官的流动', year: '', image: '', tags: ['public-space', 'public-memory', 'media', 'field-recording'] },
            { id: 'ligeti', title: '里盖蒂的100节拍器', year: '', image: '', tags: ['body', 'performance'] },
            { id: 'zhengduo', title: '争夺', year: '', image: '', tags: ['media'] },
            { id: 'xinjing', title: '心经', year: '', image: '', tags: ['zhesi', 'media'] }
        ];

        // 脉络中文名称映射
        const tagNames = {
            'zhesi': '哲思',
            'public-space': '公共空间',
            'public-memory': '公共记忆',
            'body': '身体性',
            'media': '媒介',
            'sound-image': '声音驱动影像',
            'performance': '表演',
            'field-recording': '实地录音'
        };

        // 渲染作品网格
        const grid = document.getElementById('works-grid');
        function renderWorks(filterTag = 'all') {
            let html = '';
            works.forEach(work => {
                // 判断是否符合筛选
                if (filterTag !== 'all' && !work.tags.includes(filterTag)) return;

                // 图片部分（如果有图片则显示，否则显示占位）
                const imgHtml = work.image ? `<img src="${work.image}" alt="${work.title}">` : '<span class="no-image">暂无图片</span>';

                // 生成脉络标签小圆点（每个脉络一个）
                const tagSpans = work.tags.map(tag => {
                    return `<span class="work-tag" data-tag="${tag}">${tagNames[tag] || tag}</span>`;
                }).join('');

                html += `
                    <div class="work-card" data-tags="${work.tags.join(',')}">
                        <div class="work-image">${imgHtml}</div>
                        <div class="work-info">
                            <div class="work-title">${work.title}</div>
                            <div class="work-year">${work.year || '年份未知'}</div>
                            <div class="work-tags">${tagSpans}</div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            // 添加点击卡片跳转（可改为作品详情页）
            document.querySelectorAll('.work-card').forEach(card => {
                card.addEventListener('click', function() {
                    // 这里可以跳转到作品详情页，例如 work.html?id=xxx
                    // 暂时弹出提示
                    const title = this.querySelector('.work-title').innerText;
                    alert(`即将进入作品详情：${title}`);
                });
            });
        }

        // 初始渲染（全部）
        renderWorks();

        // 脉络筛选
        const tags = document.querySelectorAll('.tag');
        tags.forEach(tagEl => {
            tagEl.addEventListener('click', function() {
                // 更新激活状态
                tags.forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                const selectedTag = this.dataset.tag;
                renderWorks(selectedTag);
            });
        });
    </script>
</body>
</html>
