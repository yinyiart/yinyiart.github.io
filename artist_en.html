<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yin Yi · Artist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #42586E;      /* R66 G88 B110 */
            font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
            color: #f0f4f8;
            line-height: 1.6;
            padding: 40px 20px;
            position: relative;
        }

        .site-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
            padding-top: 150px;           /* 与文字英文页面一致 */
        }

        /* 响应式宽度扩展 */
        @media (min-width: 1600px) {
            .site-container {
                max-width: 1600px;
            }
        }
        @media (min-width: 1900px) {
            .site-container {
                max-width: 1800px;
            }
        }

        /* 顶部导航 - 与文字英文页面完全一致 */
        .top-nav {
            position: absolute;
            top: 40px;
            right: 20px;
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #d0d8e0;
            z-index: 100;
        }
        .top-nav a {
            color: #d0d8e0;
            text-decoration: none;
            transition: color 0.2s;
        }
        .top-nav a:hover,
        .top-nav a.active {
            color: #ffffff;
        }

        /* 主内容区：左侧标签 + 右侧网格 */
        .main-content {
            display: flex;
            gap: 40px;
        }

        /* 左侧脉络面板 */
        .tag-panel {
            flex: 0 0 160px;
            position: sticky;
            top: 40px;
            align-self: flex-start;
        }
        .tag-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tag {
            padding: 4px 0;
            font-size: 0.85rem;
            line-height: 1.2;
            cursor: pointer;
            transition: 0.2s;
            color: #d0d8e0;
            background: transparent;
            border: none;
            text-align: left;
        }
        .tag:hover {
            color: #ffffff;
        }
        .tag.active {
            color: #ffffff;
            font-weight: 500;
        }

        /* 右侧作品网格 */
        .works-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        /* 作品卡片 */
        .work-card {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .work-image {
            width: 100%;
            aspect-ratio: 3 / 2;
            background-color: #7a8088;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d0d8e0;
            font-size: 0.9rem;
            overflow: hidden;
        }
        .work-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .work-info {
            padding: 0;
        }

        .work-title {
            font-size: 1.0rem;
            font-weight: 400;
            color: #f0f4f8;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .work-year {
            font-size: 0.85rem;
            color: #d0d8e0;
            margin-bottom: 6px;
        }

        .work-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .work-tag {
            font-size: 0.7rem;
            color: #d0d8e0;
            background: transparent;
            padding: 0;
            border: none;
        }

        /* 筛选隐藏 */
        .work-card.hidden {
            display: none;
        }

        /* 响应式 */
        @media (max-width: 800px) {
            .main-content {
                gap: 30px;
            }
            .tag-panel {
                flex: 0 0 140px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }
            .top-nav {
                position: static;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
                margin-bottom: 30px;
                width: 100%;
            }
            .top-nav a {
                padding: 6px 0;
                white-space: nowrap;
                color: #d0d8e0;
                font-size: 0.8rem;
            }
            .site-container {
                padding: 0 8%;
                padding-top: 0;
            }
            .main-content {
                flex-direction: column;
                gap: 20px;
            }
            .tag-panel {
                flex: auto;
                position: static;
                width: 100%;
                overflow-x: auto;
                white-space: nowrap;
                padding-bottom: 10px;
                -webkit-overflow-scrolling: touch;
            }
            .tag-list {
                flex-direction: row;
                flex-wrap: nowrap;
                gap: 15px;
            }
            .tag {
                padding: 4px 0;
                font-size: 0.8rem;
                white-space: nowrap;
            }
            .works-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .work-image {
                height: 200px;
                width: 100%;
                aspect-ratio: auto;
            }
            .work-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .work-title {
                font-size: 1.0rem;
            }
            .work-year {
                font-size: 0.8rem;
            }
            .work-tag {
                font-size: 0.7rem;
            }
        }

        @media (min-width: 1400px) {
            .work-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="index_en.html">Yin Yi</a>
        <a href="musician_en.html">Musician</a>
        <a href="artist_en.html" class="active">Artist</a>
        <a href="curator_en.html">Curator</a>
        <a href="writing_en.html">Texts</a>
        <a href="about_en.html">CV</a>
        <a href="contact_en.html">Contact</a>
        <a href="artist.html">CN</a>
    </div>

    <div class="site-container">
        <div class="main-content">
            <!-- 左侧脉络面板 -->
            <div class="tag-panel">
                <div class="tag-list" id="tag-panel">
                    <div class="tag active" data-tag="all">All</div>
                    <div class="tag" data-tag="zhesi">Contemplative</div>
                    <div class="tag" data-tag="public-space">Public Space</div>
                    <div class="tag" data-tag="public-memory">Public Memory</div>
                    <div class="tag" data-tag="body">Body</div>
                    <div class="tag" data-tag="media">Media</div>
                    <div class="tag" data-tag="sound-image">Sound-Driven Image</div>
                    <div class="tag" data-tag="performance">Performance</div>
                    <div class="tag" data-tag="field-recording">Field Recording</div>
                </div>
            </div>

            <!-- 右侧作品网格（由 JavaScript 动态生成） -->
            <div class="works-grid" id="works-grid">
                <!-- 动态生成内容 -->
            </div>
        </div>
    </div>

    <script>
        // 作品数据（英文标题，id、年份、图片路径与中文版一致）
        const works = [
            { id: 'gan', title: 'Sensory Flow', year: '2025', image: 'images/flux15.jpg', tags: ['public-space', 'public-memory', 'media', 'field-recording'] },
            { id: 'ligeti', title: 'Ligeti\'s 100 Metronomes', year: '2025', image: 'images/ligeti01.jpg', tags: ['body', 'performance'] },
            { id: 'wo', title: 'I Am Listening', year: '2023', image: 'images/listening08.jpg', tags: ['zhesi', 'public-space', 'body', 'public-memory', 'performance'] },
            { id: 'guishi', title: 'Silence Begins When Returning', year: '2023', image: 'images/gui01.jpg', tags: ['zhesi', 'performance'] },
            { id: 'bumian', title: 'Sleepless Radio', year: '2023', image: 'images/bu01.jpg', tags: ['public-memory', 'media'] },
            { id: 'women', title: 'Us Among Them, Them Among Us', year: '2022', image: 'images/wo03.jpg', tags: ['public-space', 'media', 'performance'] },
            { id: 'cong', title: 'From_____to Xintiandi', year: '2022', image: 'images/xin04.jpg', tags: ['public-space', 'public-memory', 'field-recording'] },
            { id: 'linju', title: 'Neighbor', year: '2022', image: 'images/lin03.jpg', tags: ['public-memory'] },
            { id: 'yinyue', title: 'What Does Music Really Mean to Us?', year: '2022', image: 'images/yin13.jpg', tags: ['zhesi', 'performance', 'field-recording'] },
            { id: 'shanghai', title: 'Shanghai', year: '2021', image: 'images/shanghai04.jpg', tags: ['public-space', 'public-memory', 'body', 'performance', 'field-recording'] },
            { id: 'ruch', title: 'As Before', year: '2021', image: 'images/ru01.jpg', tags: ['public-space', 'public-memory', 'performance'] },
            { id: 'shesheng', title: 'Nourishing Life', year: '2020', image: 'images/she12.jpg', tags: ['zhesi', 'body', 'performance'] },
            { id: 'zhenshen', title: 'Co-presence', year: '2019', image: 'images/05.jpg', tags: ['zhesi', 'body', 'media', 'performance'] },
            { id: 'xiangxi', title: 'Heading West', year: '2019', image: 'images/xiang04.jpg', tags: ['public-space', 'public-memory', 'sound-image', 'performance', 'field-recording'] },
            { id: 'liuge', title: 'Six Attitudes of Listening', year: '2019', image: 'images/liu01.jpg', tags: ['public-space', 'performance'] },
            { id: 'shige', title: 'Ten Corners', year: '2018', image: 'images/shi01.jpg', tags: ['zhesi'] },
            { id: 'meishuguan', title: 'Art Museum', year: '2018', image: 'images/mei01.jpg', tags: ['body', 'sound-image'] },
            { id: 'ditu', title: 'Map', year: '2018', image: 'images/ditu01.jpg', tags: ['body', 'sound-image', 'field-recording'] },
            { id: 'yici', title: 'A Journey in Shanghai', year: '2017', image: 'images/yi01.jpg', tags: ['public-space', 'public-memory', 'sound-image'] },
            { id: 'hailang', title: 'Ocean Waves', year: '2016', image: 'images/hai03.jpg', tags: ['zhesi', 'performance'] },
            { id: 'liwu', title: 'Gift', year: '2016-2021', image: 'images/li02.jpg', tags: ['public-space', 'media', 'performance'] },
            { id: 'dinghai', title: '20140901-20140930', year: '2014', image: 'images/201402.jpg', tags: ['public-space', 'public-memory', 'field-recording'] },
            { id: 'weiliao', title: 'A Farewell Party', year: '2013-2019', image: 'images/wei01.jpg', tags: ['public-space', 'public-memory', 'field-recording'] },
            { id: 'moshnegren', title: 'Stranger', year: '2013', image: 'images/mo01.jpg', tags: ['body'] },
            { id: 'heliu', title: 'You Could Listen to the Same River Infinitely', year: '2012-2016', image: 'images/ni01.jpg', tags: ['zhesi', 'field-recording'] },
            { id: 'sanfenzhong', title: 'Three Minutes', year: '2008|2020', image: 'images/san03.jpg', tags: ['public-memory', 'performance'] }
        ];

        // 脉络英文名称映射
        const tagNames = {
            'zhesi': 'Contemplative',
            'public-space': 'Public Space',
            'public-memory': 'Public Memory',
            'body': 'Body',
            'media': 'Media',
            'sound-image': 'Sound-Driven Image',
            'performance': 'Performance',
            'field-recording': 'Field Recording'
        };

        // 渲染作品网格
        const grid = document.getElementById('works-grid');
        function renderWorks(filterTag = 'all') {
            let html = '';
            works.forEach(work => {
                if (filterTag !== 'all' && !work.tags.includes(filterTag)) return;

                const imgHtml = work.image ? `<img src="${work.image}" alt="${work.title}">` : '<span>Image pending</span>';
                const tagSpans = work.tags.map(tag => {
                    return `<span class="work-tag">${tagNames[tag] || tag}</span>`;
                }).join(' · ');

                html += `
                    <div class="work-card" data-id="${work.id}" data-tags="${work.tags.join(',')}">
                        <div class="work-image">${imgHtml}</div>
                        <div class="work-info">
                            <div class="work-title">${work.title}</div>
                            <div class="work-year">${work.year || 'Year unknown'}</div>
                            <div class="work-tags">${tagSpans}</div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            // 点击卡片跳转到英文版作品详情页
            document.querySelectorAll('.work-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = this.dataset.id;
                    window.location.href = `work_en.html?id=${id}`;
                });
            });
        }

        // 初始渲染
        renderWorks();

        // 脉络筛选
        const tags = document.querySelectorAll('.tag');
        tags.forEach(tagEl => {
            tagEl.addEventListener('click', function() {
                tags.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderWorks(this.dataset.tag);
            });
        });
    </script>
</body>
</html>
